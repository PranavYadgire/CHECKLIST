<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checklist Templates</title>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <style>

    :root {
      --blue: #0c66e4;
      --blue-soft: #e9f2ff;
      --text: #172b4d;
      --muted: #626f86;
      --line: #dfe1e6;
      --bg: #f7f8f9;
      --danger: #c9372c;
      --green: #22a06b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color: var(--text);
      background: #fff;
      font-size: 13px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
    }

    .header {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .close {
      border: 0;
      background: transparent;
      color: #44546f;
      font-size: 22px;
      line-height: 1;
      padding: 3px 5px;
    }

    .content {
      padding: 11px 14px 15px;
    }

    .search {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      outline: none;
    }

    .search:focus,
    .field input:focus,
    .field select:focus,
    .item-input:focus {
      border-color: var(--blue);
      box-shadow:
        0 0 0 1px var(--blue);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-top: 8px;
    }

    .tab {
      flex: 1;
      border: 0;
      background: #fff;
      color: #44546f;
      padding: 9px 5px 8px;
    }

    .tab.active {
      color: var(--blue);
      font-weight: 600;
      border-bottom: 2px solid var(--blue);
    }

    .create {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 600;
      padding: 10px;
      margin: 9px 0 11px;
    }

    .category {
      font-size: 12px;
      font-weight: 700;
      margin: 12px 2px 6px;
    }

    .template {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 4px;
      border-bottom: 1px solid #f1f2f4;
      border-radius: 6px;
    }

    .template:hover {
      background: #f7f8f9;
    }

    .doc {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 8px;
      background: #f1f2f4;
      display: grid;
      place-items: center;
      color: #44546f;
      font-size: 16px;
    }

    .template-info {
      flex: 1;
      min-width: 0;
    }

    .template-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      font-size: 13px;
    }

    .template-description {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .count {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .more {
      border: 0;
      background: transparent;
      color: #44546f;
      padding: 4px 5px;
      font-size: 16px;
    }

    .menu {
      position: fixed;
      z-index: 30;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow:
        0 5px 16px rgba(9,30,66,.18);
      border-radius: 6px;
      width: 155px;
      padding: 4px;
    }

    .menu button {
      width: 100%;
      text-align: left;
      border: 0;
      background: #fff;
      padding: 8px 9px;
      border-radius: 4px;
      color: var(--text);
    }

    .menu button:hover {
      background: #f1f2f4;
    }

    .menu .danger {
      color: var(--danger);
    }

    .footer {
      padding: 10px 14px 15px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #f1f2f4;
    }

    .primary,
    .secondary,
    .danger-btn {
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
    }

    .primary {
      background: var(--blue);
      color: #fff;
    }

    .primary:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      background: #f1f2f4;
      color: var(--text);
    }

    .danger-btn {
      background: #fff;
      color: var(--danger);
      border: 1px solid #ffbdad;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 8px;
    }

    .form {
      padding: 15px 16px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      height: 36px;
      border: 1px solid #b6c2cf;
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .items-label {
      font-weight: 700;
      margin-bottom: 7px;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .grip {
      width: 14px;
      color: #6b778c;
      text-align: center;
    }

    .item-input {
      flex: 1;
      min-width: 0;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 0 9px;
      outline: none;
    }

    .trash {
      border: 0;
      background: #fff;
      color: #626f86;
      padding: 4px;
    }

    .add-item {
      border: 0;
      background: #f1f2f4;
      color: var(--text);
      border-radius: 5px;
      padding: 7px 10px;
      margin-top: 8px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #f1f2f4;
      margin-top: 16px;
      padding-top: 12px;
    }

    .success {
      text-align: center;
      padding: 25px 20px 21px;
    }

    .check {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #fff;
      font-size: 25px;
      margin: 0 auto 12px;
    }

    .success h2 {
      font-size: 17px;
      margin: 0 0 5px;
    }

    .success p {
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
    }

    .success-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .preview {
      padding: 15px 16px;
    }

    .preview-head {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 13px;
    }

    .preview-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: #f1f2f4;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .preview-head strong {
      display: block;
      font-size: 15px;
    }

    .preview-head small {
      color: var(--muted);
    }

    .preview-item {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
    }

    .preview-item input {
      width: 15px;
      height: 15px;
    }

    .preview-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #f1f2f4;
      margin-top: 14px;
      padding-top: 12px;
    }

    .category-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      margin: 8px 0 9px;
    }

    .category-tabs button {
      border: 0;
      background: #fff;
      color: #44546f;
      padding: 8px;
      white-space: nowrap;
    }

    .category-tabs button.active {
      color: var(--blue);
      border-bottom: 2px solid var(--blue);
    }

    .pick {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 3px;
      border-bottom: 1px solid #f1f2f4;
    }

    .pick-name {
      flex: 1;
      min-width: 0;
      font-weight: 600;
    }

    .pick-name small {
      display: block;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }

    .pick button {
      border: 0;
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 5px;
      padding: 6px 10px;
      font-weight: 600;
    }

    .error-box {
      margin: 12px 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #ffebe6;
      color: #ae2e24;
      font-size: 12px;
      line-height: 1.4;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    @media (min-width: 700px) {
      body {
        background: #f1f2f4;
        padding: 20px 0;
      }

      #app {
        border-radius: 8px;
        box-shadow:
          0 4px 18px rgba(9,30,66,.16);
        min-height: 0;
        overflow: hidden;
      }
    }

  </style>

</head>

<body>

<div id="app"></div>

<script type="module">

import {
  addTemplateToCard,
  getCurrentCardId,
} from "/src/lib/checklistTrello.js";


/* --------------------------------------------------
   Trello iframe
-------------------------------------------------- */

const t =
  TrelloPowerUp.iframe();


/* --------------------------------------------------
   Starter Templates
-------------------------------------------------- */

const starter = [

  {
    id: "starter-project-kickoff",
    name: "Project Kickoff",
    description:
      "Get started with a new project",
    category: "Project",
    icon: "🚀",
    items: [
      "Define project goals",
      "Identify stakeholders",
      "Create project plan",
      "Set deadlines",
      "Assign responsibilities",
      "Set up communication",
      "Schedule kickoff"
    ]
  },

  {
    id: "starter-task-completion",
    name: "Task Completion",
    description:
      "Ensure all key steps are done",
    category: "Tasks",
    icon: "✅",
    items: [
      "Review task requirements",
      "Complete development",
      "Perform testing",
      "Review changes",
      "Get approval",
      "Mark task complete"
    ]
  },

  {
    id: "starter-qa-review",
    name: "QA & Review",
    description:
      "Review and verify the work",
    category: "QA & Testing",
    icon: "🔍",
    items: [
      "Review requirements",
      "Test functionality",
      "Check edge cases",
      "Verify UI",
      "Check for defects",
      "Complete final review"
    ]
  },

  {
    id: "starter-client-onboarding",
    name: "Client Onboarding",
    description:
      "Set up and onboard a new client",
    category: "Onboarding",
    icon: "👥",
    items: [
      "Create client profile",
      "Send welcome email",
      "Schedule kickoff call",
      "Collect requirements",
      "Set up access",
      "Share documentation",
      "Complete onboarding"
    ]
  },

  {
    id: "starter-feature-launch",
    name: "Project / Feature Launch",
    description:
      "Complete pre-launch checklist",
    category: "Product Launch",
    icon: "🎯",
    items: [
      "Finalize feature",
      "Complete QA",
      "Prepare documentation",
      "Prepare launch assets",
      "Get approval",
      "Deploy",
      "Monitor launch",
      "Collect feedback"
    ]
  }

];


/* --------------------------------------------------
   My Templates
-------------------------------------------------- */

let mine = [];

try {

  const saved =
    JSON.parse(
      localStorage.getItem(
        "rcl_mine"
      ) || "[]"
    );

  if (Array.isArray(saved)) {
    mine = saved;
  }

} catch (error) {

  console.error(
    "Could not load saved templates",
    error
  );

}


/* Backward compatibility */

if (!mine.length) {

  try {

    const old =
      JSON.parse(
        localStorage.getItem(
          "rcl_templates"
        ) || "[]"
      );

    if (Array.isArray(old)) {

      mine =
        old
          .filter(
            item => !item.starter
          )
          .map(item => ({
            ...item,
            id:
              item.id ||
              crypto.randomUUID()
          }));

    }

  } catch (error) {

    console.error(
      "Could not migrate templates",
      error
    );

  }

}


/* --------------------------------------------------
   State
-------------------------------------------------- */

let screen = "list";

let tab = "mine";

let search = "";

let category = "All";

let selected = null;

let editingId = null;

let busy = false;

const app =
  document.getElementById(
    "app"
  );


/* --------------------------------------------------
   Helpers
-------------------------------------------------- */

function esc(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char =>
      ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char])
  );

}


function saveMine() {

  localStorage.setItem(
    "rcl_mine",
    JSON.stringify(mine)
  );

}


function closeMenu() {

  document
    .querySelectorAll(".menu")
    .forEach(
      menu => menu.remove()
    );

}


function header(title) {

  return `
    <header class="header">

      <h1>${esc(title)}</h1>

      <button
        class="close"
        onclick="go('list')"
        aria-label="Close"
      >
        ×
      </button>

    </header>
  `;

}


function go(next) {

  closeMenu();

  screen = next;

  render();

}


function allTemplates() {

  return [
    ...mine,
    ...starter
  ];

}


function currentTemplates() {

  if (tab === "starter") {

    return starter.filter(
      item =>
        (
          item.name +
          " " +
          item.description +
          " " +
          item.category
        )
          .toLowerCase()
          .includes(
            search.toLowerCase()
          )
    );

  }

  return mine.filter(
    item =>
      (
        item.name +
        " " +
        (item.description || "") +
        " " +
        item.category
      )
        .toLowerCase()
        .includes(
          search.toLowerCase()
        )
  );

}


/* --------------------------------------------------
   Render
-------------------------------------------------- */

function render() {

  closeMenu();

  if (screen === "list")
    renderList();

  if (screen === "picker")
    renderPicker();

  if (screen === "preview")
    renderPreview();

  if (screen === "form")
    renderForm();

  if (screen === "success")
    renderSuccess();

}


function renderList() {

  const templates =
    currentTemplates();

  const groups = {};

  templates.forEach(
    template => {

      if (!groups[
        template.category
      ]) {
        groups[
          template.category
        ] = [];
      }

      groups[
        template.category
      ].push(template);

    }
  );


  app.innerHTML = `

    ${header(
      "Checklist Templates"
    )}

    <main class="content">

      <input
        class="search"
        placeholder="⌕  Search templates..."
        value="${esc(search)}"
        oninput="
          search=this.value;
          render();
        "
      >

      <div class="tabs">

        <button
          class="tab ${
            tab === "mine"
              ? "active"
              : ""
          }"
          onclick="
            tab='mine';
            search='';
            render();
          "
        >
          My Templates
        </button>

        <button
          class="tab ${
            tab === "starter"
              ? "active"
              : ""
          }"
          onclick="
            tab='starter';
            search='';
            render();
          "
        >
          Starter Templates
        </button>

      </div>

      <button
        class="create"
        onclick="newTemplate()"
      >
        ＋ Create Template
      </button>

      ${
        Object.entries(
          groups
        )
        .map(
          ([group, items]) => `

            <div class="category">
              ${esc(group)}
            </div>

            ${items
              .map(
                item => `

                  <div class="template">

                    <span class="doc">
                      ${item.icon || "▤"}
                    </span>

                    <div class="template-info">

                      <span class="template-name">
                        ${esc(item.name)}
                      </span>

                      <span class="template-description">
                        ${esc(
                          item.description ||
                          `${item.items.length} checklist items`
                        )}
                      </span>

                    </div>

                    <span class="count">
                      ${item.items.length}
                    </span>

                    ${
                      tab === "mine"
                        ? `
                          <button
                            class="more"
                            onclick="
                              openMenu(
                                event,
                                '${item.id}'
                              )
                            "
                          >
                            ···
                          </button>
                        `
                        : ""
                    }

                  </div>

                `
              )
              .join("")
            }

          `
        )
        .join("")
        ||
        `
          <div class="empty">
            ${
              tab === "mine"
                ? "No templates yet."
                : "No starter templates found."
            }
          </div>
        `
      }

    </main>

    <div class="footer">

      <button
        class="primary"
        onclick="
          screen='picker';
          search='';
          category='All';
          render();
        "
      >
        Add Checklist to Card
      </button>

    </div>

  `;

}


/* --------------------------------------------------
   Menu
-------------------------------------------------- */

function openMenu(
  event,
  id
) {

  event.stopPropagation();

  closeMenu();

  const template =
    mine.find(
      item =>
        item.id === id
    );

  if (!template)
    return;

  const rect =
    event.currentTarget
      .getBoundingClientRect();

  const menu =
    document.createElement(
      "div"
    );

  menu.className = "menu";

  menu.style.left =
    Math.max(
      8,
      Math.min(
        rect.left - 120,
        innerWidth - 160
      )
    ) + "px";

  menu.style.top =
    Math.min(
      rect.bottom + 4,
      innerHeight - 190
    ) + "px";


  menu.innerHTML = `

    <button
      onclick="
        previewById('${id}')
      "
    >
      ◉ View Details
    </button>

    <button
      onclick="
        editById('${id}')
      "
    >
      ✎ Edit Template
    </button>

    <button
      onclick="
        duplicateById('${id}')
      "
    >
      ▣ Duplicate
    </button>

    <button
      class="danger"
      onclick="
        deleteById('${id}')
      "
    >
      Delete Template
    </button>

  `;


  document.body.appendChild(
    menu
  );


  setTimeout(
    () =>
      document.addEventListener(
        "click",
        closeMenu,
        {
          once: true
        }
      ),
    0
  );

}


/* --------------------------------------------------
   Picker
-------------------------------------------------- */

function renderPicker() {

  const categories = [
    "All",
    ...new Set(
      allTemplates()
        .map(
          item =>
            item.category
        )
    )
  ];


  const shown =
    allTemplates().filter(
      item =>
        (
          category === "All" ||
          item.category === category
        ) &&
        (
          item.name +
          " " +
          (item.description || "")
        )
          .toLowerCase()
          .includes(
            search.toLowerCase()
          )
    );


  app.innerHTML = `

    ${header(
      "Add Checklist from Template"
    )}

    <main class="content">

      <input
        class="search"
        placeholder="⌕  Search templates..."
        value="${esc(search)}"
        oninput="
          search=this.value;
          render();
        "
      >

      <div class="category-tabs">

        ${
          categories
            .map(
              cat => `

                <button
                  class="${
                    category === cat
                      ? "active"
                      : ""
                  }"
                  onclick="
                    category=${JSON.stringify(cat)};
                    render();
                  "
                >
                  ${esc(cat)}
                </button>

              `
            )
            .join("")
        }

      </div>


      ${
        shown
          .map(
            item => `

              <div class="pick">

                <span class="doc">
                  ${item.icon || "▤"}
                </span>

                <span class="pick-name">

                  ${esc(item.name)}

                  <small>
                    ${esc(
                      item.description ||
                      `${item.items.length} items`
                    )}
                  </small>

                </span>

                <button
                  onclick="
                    selectTemplate(
                      '${item.id}'
                    )
                  "
                >
                  Use
                </button>

              </div>

            `
          )
          .join("")
        ||
        `
          <div class="empty">
            No templates found.
          </div>
        `
      }

    </main>

  `;

}


/* --------------------------------------------------
   Select Template
-------------------------------------------------- */

function findTemplate(
  id
) {

  return allTemplates()
    .find(
      item =>
        item.id === id
    );

}


function selectTemplate(
  id
) {

  selected =
    findTemplate(id);

  if (!selected)
    return;

  screen = "preview";

  render();

}


/* --------------------------------------------------
   Preview
-------------------------------------------------- */

function renderPreview() {

  if (!selected) {

    go("picker");

    return;

  }


  app.innerHTML = `

    ${header(
      "Template Preview"
    )}

    <main class="preview">

      <div class="preview-head">

        <div class="preview-icon">
          ${selected.icon || "▤"}
        </div>

        <div>

          <strong>
            ${esc(selected.name)}
          </strong>

          <small>
            ${esc(selected.category)}
            ·
            ${selected.items.length}
            items
          </small>

        </div>

      </div>


      ${
        selected.items
          .map(
            item => `

              <div class="preview-item">

                <input
                  type="checkbox"
                  disabled
                >

                <span>
                  ${esc(item)}
                </span>

              </div>

            `
          )
          .join("")
      }


      <div class="preview-actions">

        <button
          class="secondary"
          onclick="
            screen='picker';
            render();
          "
        >
          Back
        </button>

        <button
          class="primary"
          id="addToCardButton"
          onclick="addSelectedTemplate()"
        >
          Add to Card
        </button>

      </div>

    </main>

  `;

}


/* --------------------------------------------------
   REAL TRELLO ADD
-------------------------------------------------- */

async function addSelectedTemplate() {

  if (
    busy ||
    !selected
  ) {
    return;
  }

  busy = true;


  const button =
    document.getElementById(
      "addToCardButton"
    );


  if (button) {

    button.disabled = true;

    button.textContent =
      "Adding to Trello...";

  }


  try {

    /*
     * Confirm we have the card
     * context before making API call.
     */

    await getCurrentCardId(t);


    /*
     * This creates:
     *
     * 1. Real Trello checklist
     * 2. All real checklist items
     */

    const result =
      await addTemplateToCard(
        t,
        selected
      );


    console.log(
      "Checklist successfully created:",
      result
    );


    /*
     * Tell the parent card section
     * to update its local UI too.
     */

    if (
      window.parent &&
      window.parent !== window
    ) {

      window.parent.postMessage(
        {
          type:
            "rcl:checklist-added",
          template:
            selected,
          trelloChecklist:
            result.checklist,
          trelloItems:
            result.items
        },
        "*"
      );

    }


    screen = "success";

    render();


  } catch (error) {

    console.error(
      "ADD CHECKLIST ERROR:",
      error
    );


    busy = false;


    if (button) {

      button.disabled = false;

      button.textContent =
        "Add to Card";

    }


    showError(
      getReadableError(
        error
      )
    );

  }

}


/* --------------------------------------------------
   Error Handling
-------------------------------------------------- */

function getReadableError(
  error
) {

  const message =
    error?.message ||
    String(error);


  if (
    message.includes(
      "NOT_AUTHORIZED"
    )
  ) {

    return `
      Trello authorization is required.
      Please authorize the Power-Up and try again.
    `;

  }


  return `
    Could not add the checklist to Trello.

    ${message}
  `;

}


function showError(
  message
) {

  const existing =
    document.querySelector(
      ".error-box"
    );

  if (existing)
    existing.remove();


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "error-box";

  box.textContent =
    message;


  document.body.appendChild(
    box
  );

}


/* --------------------------------------------------
   Success
-------------------------------------------------- */

function renderSuccess() {

  app.innerHTML = `

    <div class="success">

      <div class="check">
        ✓
      </div>

      <h2>
        Checklist Added
      </h2>

      <p>
        ${esc(selected.name)}
        has been added
        <br>
        to this Trello card.
      </p>

      <div class="success-actions">

        <button
          class="secondary"
          onclick="
            screen='picker';
            busy=false;
            render();
          "
        >
          Add Another
        </button>

        <button
          class="primary"
          onclick="
            go('list');
            busy=false;
          "
        >
          Done
        </button>

      </div>

    </div>

  `;

}


/* --------------------------------------------------
   Create Template
-------------------------------------------------- */

function newTemplate() {

  editingId = null;

  selected = {
    id:
      crypto.randomUUID(),
    name: "",
    description: "",
    category:
      "QA & Testing",
    icon: "▤",
    items: [""]
  };

  screen = "form";

  render();

}


function editById(id) {

  const template =
    mine.find(
      item =>
        item.id === id
    );

  if (!template)
    return;

  editingId = id;

  selected =
    JSON.parse(
      JSON.stringify(
        template
      )
    );

  screen = "form";

  render();

}


/* --------------------------------------------------
   Form
-------------------------------------------------- */

function renderForm() {

  const editing =
    Boolean(editingId);


  app.innerHTML = `

    ${header(
      editing
        ? "Edit Checklist Template"
        : "Create Checklist Template"
    )}

    <form
      class="form"
      onsubmit="
        saveTemplate(event)
      "
    >

      <div class="field">

        <label>
          Template Name
        </label>

        <input
          id="templateName"
          required
          maxlength="80"
          placeholder="Enter template name"
          value="${esc(
            selected.name
          )}"
        >

      </div>


      <div class="field">

        <label>
          Description
        </label>

        <input
          id="templateDescription"
          maxlength="120"
          placeholder="Short description"
          value="${esc(
            selected.description || ""
          )}"
        >

      </div>


      <div class="field">

        <label>
          Category
        </label>

        <select id="templateCategory">

          <option>Project</option>
          <option>Tasks</option>
          <option>QA & Testing</option>
          <option>Onboarding</option>
          <option>Product Launch</option>
          <option>Marketing</option>
          <option>Development</option>
          <option>General</option>

        </select>

      </div>


      <div class="items-label">
        Checklist Items
      </div>


      <div
        class="items"
        id="items"
      >

        ${
          selected.items
            .map(
              (item, index) =>
                itemRow(
                  item,
                  index
                )
            )
            .join("")
        }

      </div>


      <button
        type="button"
        class="add-item"
        onclick="addItem()"
      >
        ＋ Add item
      </button>


      <div class="form-actions">

        ${
          editing
            ? `
              <button
                type="button"
                class="danger-btn"
                style="margin-right:auto"
                onclick="
                  deleteById(
                    '${editingId}'
                  )
                "
              >
                Delete
              </button>
            `
            : ""
        }


        <button
          type="button"
          class="secondary"
          onclick="
            go('list')
          "
        >
          Cancel
        </button>


        <button
          type="submit"
          class="primary"
        >
          ${
            editing
              ? "Save Changes"
              : "Save Template"
          }
        </button>

      </div>

    </form>

  `;


  document.getElementById(
    "templateCategory"
  ).value =
    selected.category;

}


function itemRow(
  value,
  index
) {

  return `

    <div class="item">

      <span class="grip">
        ⁝⁝
      </span>

      <input
        class="item-input"
        value="${esc(value)}"
        placeholder="Checklist item"
      >

      <button
        type="button"
        class="trash"
        onclick="
          removeItem(
            ${index}
          )
        "
      >
        ×
      </button>

    </div>

  `;

}


function addItem() {

  const values =
    [
      ...document.querySelectorAll(
        ".item-input"
      )
    ].map(
      input =>
        input.value
    );


  selected.items =
    values;

  selected.items.push(
    ""
  );

  render();


  const inputs =
    document.querySelectorAll(
      ".item-input"
    );

  inputs[
    inputs.length - 1
  ]?.focus();

}


function removeItem(
  index
) {

  const values =
    [
      ...document.querySelectorAll(
        ".item-input"
      )
    ].map(
      input =>
        input.value
    );


  values.splice(
    index,
    1
  );


  if (!values.length) {

    values.push("");

  }


  selected.items =
    values;

  render();

}


function saveTemplate(
  event
) {

  event.preventDefault();


  const name =
    document
      .getElementById(
        "templateName"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "templateDescription"
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        "templateCategory"
      )
      .value;


  const items =
    [
      ...document.querySelectorAll(
        ".item-input"
      )
    ]
      .map(
        input =>
          input.value.trim()
      )
      .filter(Boolean);


  if (!name) {

    alert(
      "Please enter a template name."
    );

    return;

  }


  if (!items.length) {

    alert(
      "Add at least one checklist item."
    );

    return;

  }


  const template = {

    id:
      editingId ||
      crypto.randomUUID(),

    name,

    description,

    category,

    icon:
      selected.icon ||
      "▤",

    items,

  };


  if (editingId) {

    const index =
      mine.findIndex(
        item =>
          item.id ===
          editingId
      );

    if (index >= 0) {

      mine[index] =
        template;

    }

  } else {

    mine.unshift(
      template
    );

  }


  saveMine();


  selected =
    template;

  screen = "success";

  render();

}


/* --------------------------------------------------
   Duplicate
-------------------------------------------------- */

function duplicateById(
  id
) {

  const original =
    mine.find(
      item =>
        item.id === id
    );

  if (!original)
    return;


  const copy = {

    ...JSON.parse(
      JSON.stringify(
        original
      )
    ),

    id:
      crypto.randomUUID(),

    name:
      `${original.name} Copy`

  };


  mine.unshift(
    copy
  );

  saveMine();

  render();

}


/* --------------------------------------------------
   Delete
-------------------------------------------------- */

function deleteById(
  id
) {

  if (
    !confirm(
      "Delete this template?"
    )
  ) {
    return;
  }


  mine =
    mine.filter(
      item =>
        item.id !== id
    );


  saveMine();

  go("list");

}


/* --------------------------------------------------
   Start
-------------------------------------------------- */

render();

</script>
