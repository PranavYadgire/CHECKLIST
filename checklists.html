<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Checklist Templates</title>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<style>
:root{
  --blue:#0c66e4;
  --soft:#e9f2ff;
  --text:#172b4d;
  --muted:#626f86;
  --line:#dfe1e6;
  --danger:#c9372c;
  --green:#22a06b;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  font-size:13px;
  background:#fff;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  max-width:430px;
  margin:0 auto;
  background:#fff;
  min-height:100vh;
}

/* HEADER */

.header{
  height:54px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.header h1{
  font-size:16px;
  margin:0;
  font-weight:700;
}

.close{
  border:0;
  background:transparent;
  color:#44546f;
  font-size:22px;
  padding:3px 5px;
}

/* CONTENT */

.content{
  padding:11px 14px 15px;
}

.search{
  width:100%;
  height:36px;
  border:1px solid #b6c2cf;
  border-radius:6px;
  padding:0 11px;
  outline:none;
}

.search:focus,
.field input:focus,
.field select:focus,
.item-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 1px var(--blue);
}

/* TABS */

.tabs{
  display:flex;
  border-bottom:1px solid var(--line);
  margin-top:8px;
}

.tab{
  flex:1;
  border:0;
  background:#fff;
  color:#44546f;
  padding:9px 5px 8px;
}

.tab.active{
  color:var(--blue);
  font-weight:700;
  border-bottom:2px solid var(--blue);
}

/* CREATE */

.create{
  width:100%;
  border:0;
  border-radius:6px;
  background:var(--soft);
  color:var(--blue);
  font-weight:700;
  padding:10px;
  margin:9px 0 11px;
}

/* TEMPLATE LIST */

.category{
  font-size:12px;
  font-weight:700;
  margin:11px 2px 5px;
}

.template{
  min-height:48px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 3px;
  border-bottom:1px solid #f1f2f4;
}

.template:hover{
  background:#f7f8f9;
}

.doc{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#f1f2f4;
  display:grid;
  place-items:center;
  color:#44546f;
  font-size:16px;
  flex:none;
}

.template-name{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:600;
}

.count{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

.more{
  border:0;
  background:transparent;
  color:#44546f;
  padding:3px 6px;
  font-size:17px;
}

/* MENU */

.menu{
  position:fixed;
  z-index:100;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 5px 16px rgba(9,30,66,.18);
  border-radius:7px;
  width:180px;
  padding:5px;
}

.menu button{
  width:100%;
  text-align:left;
  border:0;
  background:#fff;
  padding:9px;
  border-radius:5px;
  color:var(--text);
}

.menu button:hover{
  background:#f1f2f4;
}

.menu .danger{
  color:var(--danger);
}

/* BUTTONS */

.footer{
  padding:10px 14px 15px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  border-top:1px solid #f1f2f4;
}

.primary,
.secondary,
.danger-btn{
  border:0;
  border-radius:6px;
  padding:8px 12px;
  font-weight:700;
}

.primary{
  background:var(--blue);
  color:#fff;
}

.secondary{
  background:#f1f2f4;
  color:var(--text);
}

.danger-btn{
  background:#fff;
  color:var(--danger);
  border:1px solid #ffbdad;
}

/* EMPTY */

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px 8px;
}

/* FORM */

.form{
  padding:15px 16px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:36px;
  border:1px solid #b6c2cf;
  border-radius:6px;
  padding:0 10px;
  background:#fff;
  outline:none;
}

.items-label{
  font-weight:700;
  margin-bottom:7px;
}

.items{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.item{
  display:flex;
  align-items:center;
  gap:6px;
}

.grip{
  width:14px;
  color:#6b778c;
}

.item-input{
  flex:1;
  min-width:0;
  height:32px;
  border:1px solid var(--line);
  border-radius:5px;
  padding:0 9px;
  outline:none;
}

.trash{
  border:0;
  background:#fff;
  color:#626f86;
  padding:4px;
}

.add-item{
  border:0;
  background:#f1f2f4;
  border-radius:5px;
  padding:7px 10px;
  margin-top:8px;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  border-top:1px solid #f1f2f4;
  margin-top:16px;
  padding-top:12px;
}

/* SUCCESS */

.success{
  text-align:center;
  padding:25px 20px;
}

.check{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--green);
  color:#fff;
  font-size:25px;
  margin:0 auto 12px;
}

.success h2{
  font-size:17px;
  margin:0 0 5px;
}

.success p{
  color:var(--muted);
  line-height:1.45;
  margin:0;
}

.success-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:18px;
}

/* PREVIEW */

.preview{
  padding:15px 16px;
}

.preview-head{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:13px;
}

.preview-icon{
  width:34px;
  height:34px;
  border-radius:7px;
  background:#f1f2f4;
  display:grid;
  place-items:center;
  font-size:18px;
}

.preview-head strong{
  display:block;
}

.preview-head small{
  color:var(--muted);
}

.preview-item{
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid var(--line);
  border-radius:5px;
  padding:7px 8px;
  margin-bottom:6px;
}

.preview-item input{
  width:15px;
  height:15px;
}

.preview-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  border-top:1px solid #f1f2f4;
  margin-top:14px;
  padding-top:12px;
}

/* PICKER */

.category-tabs{
  display:flex;
  overflow-x:auto;
  border-bottom:1px solid var(--line);
  margin:8px 0 9px;
}

.category-tabs button{
  border:0;
  background:#fff;
  color:#44546f;
  padding:8px;
  white-space:nowrap;
}

.category-tabs button.active{
  color:var(--blue);
  border-bottom:2px solid var(--blue);
}

.pick{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:6px 3px;
  border-bottom:1px solid #f1f2f4;
}

.pick-name{
  flex:1;
}

.pick button{
  border:0;
  background:var(--soft);
  color:var(--blue);
  border-radius:5px;
  padding:5px 10px;
  font-weight:700;
}

/* STATUS */

.status{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  background:#172b4d;
  color:#fff;
  padding:9px 13px;
  border-radius:6px;
  display:none;
  z-index:200;
  max-width:90%;
  text-align:center;
}

.status.show{
  display:block;
}

.status.error{
  background:#c9372c;
}

@media(min-width:700px){
  body{
    background:#f1f2f4;
    padding:20px 0;
  }

  #app{
    border-radius:8px;
    box-shadow:0 4px 18px rgba(9,30,66,.16);
    min-height:0;
    overflow:hidden;
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="status" class="status"></div>

<script>

const starter = [

{
  name:"Website QA Checklist",
  category:"QA & Testing",
  items:[
    "Test on staging environment",
    "Check mobile view",
    "Check broken links",
    "Verify analytics tracking",
    "Get client sign-off",
    "Deploy to production"
  ],
  starter:true
},

{
  name:"Mobile App QA",
  category:"QA & Testing",
  items:[
    "Install application",
    "Test login",
    "Test navigation",
    "Check notifications",
    "Test on multiple devices",
    "Check performance",
    "Verify app permissions",
    "Test logout"
  ],
  starter:true
},

{
  name:"Regression Testing",
  category:"QA & Testing",
  items:[
    "Review requirements",
    "Run smoke tests",
    "Test critical flows",
    "Check existing features",
    "Verify bug fixes",
    "Prepare test report"
  ],
  starter:true
},

{
  name:"Product Launch",
  category:"Product Launch",
  items:[
    "Finalize product",
    "Prepare launch plan",
    "Create marketing assets",
    "Test product",
    "Publish announcement",
    "Monitor launch",
    "Collect feedback",
    "Review results",
    "Share report"
  ],
  starter:true
},

{
  name:"Feature Launch",
  category:"Product Launch",
  items:[
    "Define feature scope",
    "Complete development",
    "Perform QA",
    "Prepare documentation",
    "Deploy feature",
    "Monitor performance",
    "Collect feedback"
  ],
  starter:true
},

{
  name:"Client Onboarding",
  category:"Onboarding",
  items:[
    "Create client profile",
    "Send welcome email",
    "Schedule kickoff call",
    "Collect requirements",
    "Set up access",
    "Share documentation",
    "Complete training",
    "Confirm onboarding"
  ],
  starter:true
},

{
  name:"Employee Onboarding",
  category:"Onboarding",
  items:[
    "Prepare workstation",
    "Create accounts",
    "Share company policies",
    "Introduce team",
    "Assign mentor",
    "Complete training",
    "Review first week",
    "Collect feedback",
    "Set goals",
    "Schedule check-in"
  ],
  starter:true
},

{
  name:"Campaign Launch",
  category:"Marketing",
  items:[
    "Define campaign goals",
    "Identify target audience",
    "Prepare content",
    "Create campaign assets",
    "Review campaign",
    "Schedule launch"
  ],
  starter:true
}

];

let mine = [];

try{
  mine = JSON.parse(localStorage.getItem("rcl_mine") || "null");
}catch(e){
  mine = null;
}

if(!Array.isArray(mine)){
  mine = [];
}

let screen = "list";
let tab = "mine";
let query = "";
let cat = "All";
let editIndex = -1;
let selected = null;

const app = document.getElementById("app");
const statusEl = document.getElementById("status");

function save(){

  localStorage.setItem(
    "rcl_mine",
    JSON.stringify(mine)
  );

}

function closeMenu(){

  document
    .querySelectorAll(".menu")
    .forEach(x => x.remove());

}

function toast(message,error=false){

  statusEl.textContent = message;

  statusEl.className =
    "status show" +
    (error ? " error" : "");

  clearTimeout(window.__toast);

  window.__toast = setTimeout(
    () => {
      statusEl.className = "status";
    },
    3500
  );

}

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));

}

function header(title){

  return `
    <header class="header">
      <h1>${esc(title)}</h1>

      <button
        class="close"
        onclick="screen='list';render()"
      >
        ×
      </button>
    </header>
  `;

}

function render(){

  closeMenu();

  if(screen === "list"){
    list();
  }

  if(screen === "form"){
    form();
  }

  if(screen === "created"){
    created();
  }

  if(screen === "picker"){
    picker();
  }

  if(screen === "preview"){
    preview();
  }

  if(screen === "added"){
    added();
  }

}

function visibleTemplates(){

  const source =
    tab === "starter"
      ? starter
      : mine;

  return source.filter(
    x =>
      (x.name + " " + x.category)
      .toLowerCase()
      .includes(query.toLowerCase())
  );

}

function list(){

  const arr = visibleTemplates();
  const groups = {};

  arr.forEach(
    x => {
      (groups[x.category] ??= []).push(x);
    }
  );

  app.innerHTML =
    header("Checklist Templates") +

    `
    <main class="content">

      <input
        class="search"
        value="${esc(query)}"
        placeholder="⌕  Search templates..."
        oninput="query=this.value;render()"
      >

      <div class="tabs">

        <button
          class="tab ${tab === "mine" ? "active" : ""}"
          onclick="tab='mine';query='';render()"
        >
          My Templates
        </button>

        <button
          class="tab ${tab === "starter" ? "active" : ""}"
          onclick="tab='starter';query='';render()"
        >
          Starter Templates
        </button>

      </div>

      <button
        class="create"
        onclick="newTemplate()"
      >
        ＋ Create Template
      </button>

      ${
        Object.entries(groups)
        .map(
          ([group,items]) => `

            <div class="category">
              ${esc(group)}
            </div>

            ${
              items
              .map(
                (x,i) => {

                  const id =
                    tab === "mine"
                      ? x.id
                      : i;

                  return `

                    <div class="template">

                      <span class="doc">
                        ▤
                      </span>

                      <span class="template-name">
                        ${esc(x.name)}
                      </span>

                      <span class="count">
                        ${x.items.length}
                      </span>

                      <button
                        class="more"
                        onclick="openMenu(event,'${esc(String(id))}')"
                      >
                        ···
                      </button>

                    </div>

                  `;

                }
              )
              .join("")
            }

          `
        )
        .join("")
      }

      ${
        !Object.keys(groups).length
          ? `<div class="empty">No templates found.</div>`
          : ""
      }

    </main>
    `;

}

function getTemplate(id){

  if(tab === "mine"){
    return mine.find(
      x => x.id === id
    );
  }

  return starter[Number(id)];

}

function openMenu(event,id){

  event.stopPropagation();

  closeMenu();

  const rect =
    event.currentTarget.getBoundingClientRect();

  const menu =
    document.createElement("div");

  menu.className = "menu";

  menu.style.left =
    Math.max(
      8,
      Math.min(
        rect.left - 135,
        innerWidth - 188
      )
    ) + "px";

  menu.style.top =
    Math.min(
      rect.bottom + 3,
      innerHeight - 205
    ) + "px";

  menu.innerHTML = `

    <button onclick="addFromMenu('${id}')">
      ＋ &nbsp; Add to Card
    </button>

    <button onclick="previewFromMenu('${id}')">
      ◉ &nbsp; View Details
    </button>

    ${
      tab === "mine"
      ?
      `

      <button onclick="editFromMenu('${id}')">
        ✎ &nbsp; Edit Template
      </button>

      <button onclick="duplicateFromMenu('${id}')">
        ▣ &nbsp; Duplicate
      </button>

      <button
        class="danger"
        onclick="deleteFromMenu('${id}')"
      >
        ▤ &nbsp; Delete Template
      </button>

      `
      :
      ""
    }

  `;

  document.body.appendChild(menu);

  setTimeout(
    () => {
      document.addEventListener(
        "click",
        closeMenu,
        {once:true}
      );
    },
    0
  );

}

function addFromMenu(id){

  closeMenu();

  selected =
    getTemplate(id);

  addToCard();

}

function previewFromMenu(id){

  closeMenu();

  selected =
    getTemplate(id);

  screen = "preview";

  render();

}

function editFromMenu(id){

  closeMenu();

  editIndex =
    mine.findIndex(
      x => x.id === id
    );

  screen = "form";

  render();

}

function duplicateFromMenu(id){

  const original =
    mine.find(
      x => x.id === id
    );

  if(!original){
    return;
  }

  mine.unshift({

    ...original,

    id:
      crypto.randomUUID(),

    name:
      original.name + " Copy",

    items:
      [...original.items]

  });

  save();

  render();

  toast("Template duplicated");

}

function deleteFromMenu(id){

  if(!confirm("Delete this template?")){
    return;
  }

  mine =
    mine.filter(
      x => x.id !== id
    );

  save();

  render();

  toast("Template deleted");

}

function newTemplate(){

  editIndex = -1;

  screen = "form";

  render();

}

function form(){

  const x =
    editIndex >= 0
      ? mine[editIndex]
      : {
          name:"",
          category:"QA & Testing",
          items:[""]
        };

  app.innerHTML =
    header(
      editIndex >= 0
        ? "Edit Checklist Template"
        : "Create Checklist Template"
    ) +

    `

    <form
      class="form"
      onsubmit="saveForm(event)"
    >

      <div class="field">

        <label>
          Template Name
        </label>

        <input
          id="name"
          required
          maxlength="80"
          value="${esc(x.name)}"
        >

      </div>

      <div class="field">

        <label>
          Category
        </label>

        <select id="category">

          <option>QA & Testing</option>
          <option>Product Launch</option>
          <option>Onboarding</option>
          <option>Marketing</option>
          <option>General</option>

        </select>

      </div>

      <div class="items-label">
        Checklist Items
      </div>

      <div
        class="items"
        id="items"
      >
        ${x.items.map(itemRow).join("")}
      </div>

      <button
        type="button"
        class="add-item"
        onclick="addItem()"
      >
        ＋ Add item
      </button>

      <div class="form-actions">

        <button
          type="button"
          class="secondary"
          onclick="screen='list';render()"
        >
          Cancel
        </button>

        <button class="primary">
          ${
            editIndex >= 0
              ? "Save Changes"
              : "Save Template"
          }
        </button>

      </div>

    </form>

    `;

  document.getElementById(
    "category"
  ).value = x.category;

}

function itemRow(value){

  return `

    <div class="item">

      <span class="grip">
        ⁝⁝
      </span>

      <input
        class="item-input"
        value="${esc(value)}"
        placeholder="Checklist item"
      >

      <button
        type="button"
        class="trash"
        onclick="this.parentElement.remove()"
      >
        ✕
      </button>

    </div>

  `;

}

function addItem(){

  document
    .getElementById("items")
    .insertAdjacentHTML(
      "beforeend",
      itemRow("")
    );

  document
    .querySelectorAll(".item-input")
    .at(-1)
    ?.focus();

}

function saveForm(event){

  event.preventDefault();

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const category =
    document
      .getElementById("category")
      .value;

  const items =
    [
      ...document.querySelectorAll(
        ".item-input"
      )
    ]
    .map(
      x => x.value.trim()
    )
    .filter(Boolean);

  if(!name || !items.length){

    toast(
      "Enter a name and at least one item.",
      true
    );

    return;
  }

  if(editIndex >= 0){

    mine[editIndex] = {

      ...mine[editIndex],

      name,
      category,
      items

    };

  }else{

    mine.unshift({

      id:crypto.randomUUID(),

      name,

      category,

      items

    });

  }

  save();

  selected = {
    name,
    category,
    items
  };

  screen = "created";

  render();

}

function created(){

  app.innerHTML = `

    <div class="success">

      <div class="check">
        ✓
      </div>

      <h2>
        ${
          editIndex >= 0
            ? "Changes Saved"
            : "Template Created"
        }
      </h2>

      <p>
        ${esc(selected.name)}
        is ready in your template library.
      </p>

      <div class="success-actions">

        <button
          class="secondary"
          onclick="screen='list';render()"
        >
          View Templates
        </button>

        <button
          class="primary"
          onclick="addToCard()"
        >
          ＋ Add to Card
        </button>

      </div>

    </div>

  `;

}

function picker(){

  const categories = [
    "All",
    ...new Set(
      mine.map(x => x.category)
    )
  ];

  const arr =
    mine.filter(
      x =>
        (cat === "All" || x.category === cat) &&
        (x.name + " " + x.category)
          .toLowerCase()
          .includes(query.toLowerCase())
    );

  app.innerHTML =
    header(
      "Add Checklist from Template"
    ) +

    `

    <main class="content">

      <input
        class="search"
        value="${esc(query)}"
        placeholder="⌕  Search templates..."
        oninput="query=this.value;render()"
      >

      <div class="category-tabs">

        ${
          categories
          .map(
            c => `

              <button
                class="${cat === c ? "active" : ""}"
                onclick="cat=${JSON.stringify(c)};render()"
              >
                ${esc(c)}
              </button>

            `
          )
          .join("")
        }

      </div>

      ${
        arr
        .map(
          x => `

            <div class="pick">

              <span class="doc">
                ▤
              </span>

              <span class="pick-name">
                ${esc(x.name)}
              </span>

              <span class="count">
                ${x.items.length}
              </span>

              <button
                onclick="
                  selected=mine.find(
                    y=>y.id==='${x.id}'
                  );
                  addToCard();
                "
              >
                Add to Card
              </button>

            </div>

          `
        )
        .join("")
        ||
        `<div class="empty">
          No templates found.
        </div>`
      }

    </main>

    `;

}

function preview(){

  const x = selected;

  if(!x){
    screen = "list";
    render();
    return;
  }

  app.innerHTML =
    header("Template Preview") +

    `

    <main class="preview">

      <div class="preview-head">

        <div class="preview-icon">
          ▤
        </div>

        <div>

          <strong>
            ${esc(x.name)}
          </strong>

          <small>
            ${esc(x.category)}
            ·
            ${x.items.length} items
          </small>

        </div>

      </div>

      ${
        x.items
        .map(
          item => `

            <div class="preview-item">

              <input
                type="checkbox"
                disabled
              >

              <span>
                ${esc(item)}
              </span>

            </div>

          `
        )
        .join("")
      }

      <div class="preview-actions">

        <button
          class="secondary"
          onclick="screen='list';render()"
        >
          Back
        </button>

        <button
          class="primary"
          onclick="addToCard()"
        >
          ＋ Add to Card
        </button>

      </div>

    </main>

    `;

}

async function addToCard(){

  if(!selected){

    toast(
      "Please select a template first.",
      true
    );

    return;

  }

  try{

    screen = "added";
    render();

    const trello =
      window.TrelloPowerUp.iframe();

    if(
      !trello ||
      typeof trello.card !== "function"
    ){

      throw new Error(
        "Trello card context is unavailable."
      );

    }

    const card =
      await trello.card("id");

    if(!card || !card.id){

      throw new Error(
        "Could not find the current Trello card."
      );

    }

    /*
      IMPORTANT:
      This uses the Trello REST API client
      available through the Power-Up iframe.
    */

    const restApi = trello.getRestApi();

let authorized = await restApi.isAuthorized();

if (!authorized) {
  await restApi.authorize({
    expiration: "never"
  });

  authorized = await restApi.isAuthorized();
}

if (!authorized) {
  throw new Error(
    "Trello authorization was not completed."
  );
}

    /*
      Create checklist on current card.
    */

    const checklist =
      await restApi.post(
        `/cards/${card.id}/checklists`,
        {
          name:selected.name
        }
      );

    if(
      !checklist ||
      !checklist.id
    ){

      throw new Error(
        "Trello did not return a checklist ID."
      );

    }

    /*
      Create each checklist item.
    */

    for(
      const item of selected.items
    ){

      const itemName =
        typeof item === "string"
          ? item.trim()
          : String(
              item?.name || ""
            ).trim();

      if(!itemName){
        continue;
      }

      await restApi.post(
        `/checklists/${checklist.id}/checkItems`,
        {
          name:itemName
        }
      );

    }

    app.innerHTML = `

      <div class="success">

        <div class="check">
          ✓
        </div>

        <h2>
          Checklist Added
        </h2>

        <p>
          "${esc(selected.name)}"
          was successfully added to this Trello card.
        </p>

        <div class="success-actions">

          <button
            class="primary"
            onclick="window.close()"
          >
            Done
          </button>

        </div>

      </div>

    `;

  }catch(error){

    console.error(
      "ADD TO CARD ERROR:",
      error
    );

    screen = "preview";

    render();

    toast(
      error?.message ||
      "Could not add checklist to Trello.",
      true
    );

  }

}

function added(){

  app.innerHTML = `

    <div class="success">

      <div class="check">
        ...
      </div>

      <h2>
        Adding Checklist…
      </h2>

      <p>
        ${esc(selected?.name || "Checklist")}
        is being added to this Trello card.
      </p>

    </div>

  `;

}

render();

</script>
