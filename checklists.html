<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checklist Templates</title>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #172b4d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      font-size: 13px;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
    }

    .header {
      height: 52px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dfe1e6;
      background: #ffffff;
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #172b4d;
    }

    .close {
      border: 0;
      background: transparent;
      color: #5e6c84;
      font-size: 22px;
      padding: 3px 6px;
      border-radius: 5px;
    }

    .close:hover {
      background: #f1f2f4;
    }

    .content {
      padding: 12px 14px;
    }

    .search {
      width: 100%;
      height: 37px;
      border: 1px solid #b6c2cf;
      border-radius: 6px;
      padding: 0 11px;
      outline: none;
      color: #172b4d;
      background: #fff;
    }

    .search:focus,
    .field input:focus,
    .field select:focus,
    .item input:focus {
      border-color: #0c66e4;
      box-shadow: 0 0 0 1px #0c66e4;
    }

    .tabs {
      display: flex;
      margin-top: 9px;
      border-bottom: 1px solid #dfe1e6;
    }

    .tab {
      flex: 1;
      border: 0;
      background: #fff;
      color: #5e6c84;
      padding: 9px 5px;
      font-weight: 500;
    }

    .tab:hover {
      background: #f7f8f9;
    }

    .tab.active {
      color: #0c66e4;
      font-weight: 700;
      border-bottom: 2px solid #0c66e4;
    }

    .create {
      width: 100%;
      margin: 10px 0 12px;
      border: 0;
      border-radius: 6px;
      background: #e9f2ff;
      color: #0c66e4;
      padding: 10px;
      font-weight: 700;
    }

    .create:hover {
      background: #dbeafe;
    }

    .category {
      margin: 13px 2px 6px;
      font-size: 12px;
      font-weight: 700;
      color: #5e6c84;
    }

    .template {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 7px 4px;
      border-bottom: 1px solid #f1f2f4;
      border-radius: 6px;
    }

    .template:hover {
      background: #f7f8f9;
    }

    .doc {
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      border-radius: 8px;
      background: #f1f2f4;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .template-info {
      flex: 1;
      min-width: 0;
    }

    .template-name {
      display: block;
      font-weight: 700;
      color: #172b4d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .template-description {
      display: block;
      margin-top: 2px;
      color: #6b778c;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .count {
      color: #6b778c;
      font-size: 11px;
      white-space: nowrap;
    }

    .more {
      border: 0;
      background: transparent;
      color: #5e6c84;
      padding: 5px 6px;
      font-size: 15px;
      border-radius: 5px;
    }

    .more:hover {
      background: #dfe1e6;
    }

    .empty {
      text-align: center;
      color: #6b778c;
      padding: 30px 10px;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 14px 14px;
      border-top: 1px solid #f1f2f4;
    }

    .primary,
    .secondary,
    .danger {
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 700;
      border: 0;
    }

    .primary {
      background: #0c66e4;
      color: #ffffff;
    }

    .primary:hover {
      background: #0055cc;
    }

    .secondary {
      background: #f1f2f4;
      color: #172b4d;
    }

    .secondary:hover {
      background: #dfe1e6;
    }

    .danger {
      color: #c9372c;
      background: #fff;
      border: 1px solid #ffbdad;
    }

    .danger:hover {
      background: #ffebe6;
    }

    .menu {
      position: fixed;
      z-index: 100;
      width: 155px;
      padding: 4px;
      background: #ffffff;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      box-shadow: 0 8px 22px rgba(9, 30, 66, 0.2);
    }

    .menu button {
      display: block;
      width: 100%;
      border: 0;
      background: #fff;
      color: #172b4d;
      text-align: left;
      padding: 8px 9px;
      border-radius: 4px;
    }

    .menu button:hover {
      background: #f1f2f4;
    }

    .menu .delete-option {
      color: #c9372c;
    }

    .form {
      padding: 15px 15px 4px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      height: 36px;
      border: 1px solid #b6c2cf;
      border-radius: 6px;
      padding: 0 9px;
      outline: none;
      background: #fff;
      color: #172b4d;
    }

    .items-label {
      font-weight: 700;
      margin-bottom: 7px;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .grip {
      width: 14px;
      color: #6b778c;
      text-align: center;
    }

    .item input {
      flex: 1;
      min-width: 0;
      height: 32px;
      border: 1px solid #dfe1e6;
      border-radius: 5px;
      padding: 0 8px;
      outline: none;
    }

    .trash {
      border: 0;
      background: transparent;
      color: #6b778c;
      font-size: 16px;
      padding: 4px 6px;
    }

    .trash:hover {
      color: #c9372c;
    }

    .add-item {
      margin-top: 8px;
      border: 0;
      border-radius: 5px;
      background: #f1f2f4;
      color: #172b4d;
      padding: 7px 10px;
      font-weight: 600;
    }

    .form-footer {
      margin-top: 12px;
    }

    .preview {
      padding: 15px;
    }

    .preview-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .preview-title strong {
      display: block;
      margin-bottom: 3px;
    }

    .muted {
      color: #6b778c;
      line-height: 1.4;
    }

    .preview-item {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
    }

    .preview-item input {
      width: 15px;
      height: 15px;
    }

    .category-tabs {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid #dfe1e6;
      margin: 9px 0;
    }

    .category-tabs button {
      border: 0;
      background: #fff;
      color: #5e6c84;
      padding: 8px 7px;
    }

    .category-tabs button.active {
      color: #0c66e4;
      font-weight: 700;
      border-bottom: 2px solid #0c66e4;
    }

    .pick {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 7px 4px;
      border-bottom: 1px solid #f1f2f4;
    }

    .pick-name {
      flex: 1;
      min-width: 0;
      font-weight: 700;
    }

    .pick-name small {
      display: block;
      font-weight: 400;
      margin-top: 2px;
    }

    .use-button {
      border: 0;
      border-radius: 5px;
      background: #e9f2ff;
      color: #0c66e4;
      padding: 6px 10px;
      font-weight: 700;
    }

    .use-button:hover {
      background: #dbeafe;
    }

    .success {
      padding: 28px 18px 22px;
      text-align: center;
    }

    .checkmark {
      width: 45px;
      height: 45px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #22a06b;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    .success h2 {
      margin: 0 0 7px;
      font-size: 18px;
    }

    .success-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .error {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 200;
      padding: 10px 12px;
      background: #ffebe6;
      color: #ae2e24;
      border-radius: 6px;
      box-shadow: 0 5px 15px rgba(9, 30, 66, .18);
      font-size: 12px;
    }

    .loading {
      text-align: center;
      padding: 35px 15px;
      color: #6b778c;
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>
/*
==========================================================
 REUSABLE CHECKLIST LIBRARY
 IMPORTANT:
 This file intentionally uses a NORMAL script.
 All button functions are exposed on window so that
 onclick="..." works correctly.
==========================================================
*/


/* -------------------------------------------------------
   Trello iframe
------------------------------------------------------- */

var trello = null;

try {
  trello = window.TrelloPowerUp.iframe();
} catch (error) {
  console.error("Trello iframe initialization failed:", error);
}


/* -------------------------------------------------------
   Starter Templates
------------------------------------------------------- */

var starterTemplates = [

  {
    id: "starter-project-kickoff",
    name: "Project Kickoff",
    description: "Get started with a new project",
    category: "Project",
    icon: "🚀",
    starter: true,
    items: [
      "Define project goals",
      "Identify stakeholders",
      "Create project plan",
      "Set deadlines",
      "Assign responsibilities",
      "Set up communication",
      "Schedule kickoff"
    ]
  },

  {
    id: "starter-task-completion",
    name: "Task Completion",
    description: "Ensure all key steps are done",
    category: "Tasks",
    icon: "✅",
    starter: true,
    items: [
      "Review task requirements",
      "Complete development",
      "Perform testing",
      "Review changes",
      "Get approval",
      "Mark task complete"
    ]
  },

  {
    id: "starter-qa-review",
    name: "QA & Review",
    description: "Review and verify the work",
    category: "QA & Testing",
    icon: "🔍",
    starter: true,
    items: [
      "Review requirements",
      "Test functionality",
      "Check edge cases",
      "Verify UI",
      "Check for defects",
      "Complete final review"
    ]
  },

  {
    id: "starter-client-onboarding",
    name: "Client Onboarding",
    description: "Set up and onboard a new client",
    category: "Onboarding",
    icon: "👥",
    starter: true,
    items: [
      "Create client profile",
      "Send welcome email",
      "Schedule kickoff call",
      "Collect requirements",
      "Set up access",
      "Share documentation",
      "Complete onboarding"
    ]
  },

  {
    id: "starter-feature-launch",
    name: "Project / Feature Launch",
    description: "Complete pre-launch checklist",
    category: "Product Launch",
    icon: "🎯",
    starter: true,
    items: [
      "Finalize feature",
      "Complete QA",
      "Prepare documentation",
      "Prepare launch assets",
      "Get approval",
      "Deploy",
      "Monitor launch",
      "Collect feedback"
    ]
  }

];


/* -------------------------------------------------------
   My Templates
------------------------------------------------------- */

var myTemplates = [];

try {

  var saved =
    JSON.parse(
      localStorage.getItem("rcl_mine") || "[]"
    );

  if (Array.isArray(saved)) {
    myTemplates = saved;
  }

} catch (error) {

  console.error(
    "Could not load my templates:",
    error
  );

}


/* -------------------------------------------------------
   Backward compatibility
------------------------------------------------------- */

if (!myTemplates.length) {

  try {

    var oldSaved =
      JSON.parse(
        localStorage.getItem("rcl_templates") || "[]"
      );

    if (Array.isArray(oldSaved)) {

      myTemplates =
        oldSaved.filter(function(item) {
          return !item.starter;
        });

    }

  } catch (error) {

    console.error(
      "Could not migrate old templates:",
      error
    );

  }

}


/* -------------------------------------------------------
   State
------------------------------------------------------- */

var currentScreen = "list";

var currentTab = "mine";

var currentSearch = "";

var currentCategory = "All";

var selectedTemplate = null;

var editingId = null;

var app =
  document.getElementById("app");


/* -------------------------------------------------------
   Utility
------------------------------------------------------- */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function saveMyTemplates() {

  localStorage.setItem(
    "rcl_mine",
    JSON.stringify(myTemplates)
  );

}


function closeMenus() {

  var menus =
    document.querySelectorAll(".menu");

  menus.forEach(function(menu) {
    menu.remove();
  });

}


function getAllTemplates() {

  return myTemplates.concat(
    starterTemplates
  );

}


function findTemplateById(id) {

  var all =
    getAllTemplates();

  return all.find(function(template) {
    return template.id === id;
  });

}


function header(title) {

  return `
    <div class="header">

      <h1>
        ${escapeHtml(title)}
      </h1>

      <button
        class="close"
        onclick="goToList()"
      >
        ×
      </button>

    </div>
  `;

}


/* -------------------------------------------------------
   Navigation
------------------------------------------------------- */

function goToList() {

  closeMenus();

  currentScreen = "list";

  currentSearch = "";

  currentCategory = "All";

  render();

}


function render() {

  closeMenus();

  if (currentScreen === "list") {
    renderList();
    return;
  }

  if (currentScreen === "form") {
    renderForm();
    return;
  }

  if (currentScreen === "picker") {
    renderPicker();
    return;
  }

  if (currentScreen === "preview") {
    renderPreview();
    return;
  }

  if (currentScreen === "success") {
    renderSuccess();
    return;
  }

  renderList();

}


/* -------------------------------------------------------
   LIST
------------------------------------------------------- */

function renderList() {

  var templates =
    currentTab === "mine"
      ? myTemplates
      : starterTemplates;


  var filtered =
    templates.filter(function(template) {

      var text =
        (
          template.name +
          " " +
          template.category +
          " " +
          (template.description || "")
        ).toLowerCase();

      return text.includes(
        currentSearch.toLowerCase()
      );

    });


  var groups = {};


  filtered.forEach(function(template) {

    if (!groups[template.category]) {
      groups[template.category] = [];
    }

    groups[template.category].push(
      template
    );

  });


  var html = "";

  html += header(
    "Checklist Templates"
  );


  html += `
    <div class="content">

      <input
        class="search"
        placeholder="⌕  Search templates..."
        value="${escapeHtml(currentSearch)}"
        oninput="
          currentSearch=this.value;
          render();
        "
      >

      <div class="tabs">

        <button
          class="tab ${
            currentTab === "mine"
              ? "active"
              : ""
          }"
          onclick="
            currentTab='mine';
            currentSearch='';
            render();
          "
        >
          My Templates
        </button>

        <button
          class="tab ${
            currentTab === "starter"
              ? "active"
              : ""
          }"
          onclick="
            currentTab='starter';
            currentSearch='';
            render();
          "
        >
          Starter Templates
        </button>

      </div>


      <button
        class="create"
        onclick="createNewTemplate()"
      >
        ＋ Create Template
      </button>
  `;


  if (!filtered.length) {

    html += `
      <div class="empty">
        ${
          currentTab === "mine"
            ? "No templates yet."
            : "No starter templates found."
        }
      </div>
    `;

  } else {

    Object.keys(groups)
      .forEach(function(category) {

        html += `
          <div class="category">
            ${escapeHtml(category)}
          </div>
        `;


        groups[category]
          .forEach(function(template) {

            var index =
              myTemplates.indexOf(
                template
              );


            html += `
              <div class="template">

                <span class="doc">
                  ${template.icon || "▤"}
                </span>

                <div class="template-info">

                  <span class="template-name">
                    ${escapeHtml(
                      template.name
                    )}
                  </span>

                  <span class="template-description">
                    ${escapeHtml(
                      template.description ||
                      (
                        template.items.length +
                        " checklist items"
                      )
                    )}
                  </span>

                </div>

                <span class="count">
                  ${template.items.length}
                </span>

                ${
                  currentTab === "mine"
                    ? `
                      <button
                        class="more"
                        onclick="
                          openTemplateMenu(
                            event,
                            '${template.id}'
                          )
                        "
                      >
                        ···
                      </button>
                    `
                    : ""
                }

              </div>
            `;

          });

      });

  }


  html += `
    </div>

    <div class="footer">

      <button
        class="primary"
        onclick="openCardPicker()"
      >
        Add Checklist to Card
      </button>

    </div>
  `;


  app.innerHTML = html;

}


/* -------------------------------------------------------
   CREATE TEMPLATE
------------------------------------------------------- */

function createNewTemplate() {

  editingId = null;

  selectedTemplate = {

    id:
      "template-" +
      Date.now(),

    name: "",

    description: "",

    category: "QA & Testing",

    icon: "▤",

    items: [""]

  };


  currentScreen = "form";

  render();

}


/* -------------------------------------------------------
   EDIT MENU
------------------------------------------------------- */

function openTemplateMenu(
  event,
  id
) {

  event.stopPropagation();

  closeMenus();


  var template =
    findTemplateById(id);

  if (!template) {
    return;
  }


  var rect =
    event.currentTarget
      .getBoundingClientRect();


  var menu =
    document.createElement(
      "div"
    );


  menu.className =
    "menu";


  menu.style.left =
    Math.max(
      8,
      Math.min(
        rect.left - 115,
        window.innerWidth - 163
      )
    ) + "px";


  menu.style.top =
    Math.min(
      rect.bottom + 4,
      window.innerHeight - 170
    ) + "px";


  menu.innerHTML = `

    <button
      onclick="
        closeMenus();
        openTemplatePreview(
          '${id}'
        )
      "
    >
      ▤ View Details
    </button>

    <button
      onclick="
        closeMenus();
        editTemplate(
          '${id}'
        )
      "
    >
      ✎ Edit Template
    </button>

    <button
      onclick="
        closeMenus();
        duplicateTemplate(
          '${id}'
        )
      "
    >
      ▣ Duplicate
    </button>

    <button
      class="delete-option"
      onclick="
        closeMenus();
        deleteTemplate(
          '${id}'
        )
      "
    >
      Delete Template
    </button>

  `;


  document.body.appendChild(
    menu
  );


  setTimeout(function() {

    document.addEventListener(
      "click",
      closeMenus,
      {
        once: true
      }
    );

  }, 0);

}


/* -------------------------------------------------------
   EDIT
------------------------------------------------------- */

function editTemplate(id) {

  var template =
    myTemplates.find(
      function(item) {
        return item.id === id;
      }
    );


  if (!template) {
    return;
  }


  editingId = id;


  selectedTemplate =
    JSON.parse(
      JSON.stringify(
        template
      )
    );


  currentScreen = "form";

  render();

}


/* -------------------------------------------------------
   DUPLICATE
------------------------------------------------------- */

function duplicateTemplate(id) {

  var template =
    myTemplates.find(
      function(item) {
        return item.id === id;
      }
    );


  if (!template) {
    return;
  }


  var copy =
    JSON.parse(
      JSON.stringify(
        template
      )
    );


  copy.id =
    "template-" +
    Date.now();


  copy.name =
    template.name +
    " Copy";


  myTemplates.unshift(
    copy
  );


  saveMyTemplates();

  render();

}


/* -------------------------------------------------------
   DELETE
------------------------------------------------------- */

function deleteTemplate(id) {

  var template =
    myTemplates.find(
      function(item) {
        return item.id === id;
      }
    );


  if (!template) {
    return;
  }


  var confirmed =
    window.confirm(
      'Delete "' +
      template.name +
      '"?'
    );


  if (!confirmed) {
    return;
  }


  myTemplates =
    myTemplates.filter(
      function(item) {
        return item.id !== id;
      }
    );


  saveMyTemplates();

  render();

}


/* -------------------------------------------------------
   FORM
------------------------------------------------------- */

function renderForm() {

  var editing =
    editingId !== null;


  var html = "";


  html += header(
    editing
      ? "Edit Checklist Template"
      : "Create Checklist Template"
  );


  html += `
    <div class="form">

      <div class="field">

        <label>
          Template Name
        </label>

        <input
          id="templateName"
          type="text"
          placeholder="Enter template name"
          value="${escapeHtml(
            selectedTemplate.name
          )}"
        >

      </div>


      <div class="field">

        <label>
          Description
        </label>

        <input
          id="templateDescription"
          type="text"
          placeholder="Short description"
          value="${escapeHtml(
            selectedTemplate.description || ""
          )}"
        >

      </div>


      <div class="field">

        <label>
          Category
        </label>

        <select id="templateCategory">

          <option value="Project">
            Project
          </option>

          <option value="Tasks">
            Tasks
          </option>

          <option value="QA & Testing">
            QA & Testing
          </option>

          <option value="Onboarding">
            Onboarding
          </option>

          <option value="Product Launch">
            Product Launch
          </option>

          <option value="Development">
            Development
          </option>

          <option value="Marketing">
            Marketing
          </option>

          <option value="General">
            General
          </option>

        </select>

      </div>


      <div class="items-label">
        Checklist Items
      </div>


      <div
        class="items"
        id="items"
      >
  `;


  selectedTemplate.items
    .forEach(
      function(item, index) {

        html += `
          <div class="item">

            <span class="grip">
              ⁝⁝
            </span>

            <input
              type="text"
              placeholder="Checklist item"
              value="${escapeHtml(item)}"
            >

            <button
              class="trash"
              onclick="
                removeChecklistItem(
                  ${index}
                )
              "
            >
              ×
            </button>

          </div>
        `;

      }
    );


  html += `

      </div>


      <button
        class="add-item"
        onclick="addChecklistItem()"
      >
        ＋ Add item
      </button>

    </div>


    <div class="footer form-footer">

      ${
        editing
          ? `
            <button
              class="danger"
              style="margin-right:auto"
              onclick="
                deleteTemplate(
                  '${editingId}'
                )
              "
            >
              Delete Template
            </button>
          `
          : ""
      }


      <button
        class="secondary"
        onclick="goToList()"
      >
        Cancel
      </button>


      <button
        class="primary"
        onclick="saveTemplate()"
      >
        ${
          editing
            ? "Save Changes"
            : "Save Template"
        }
      </button>

    </div>
  `;


  app.innerHTML =
    html;


  document.getElementById(
    "templateCategory"
  ).value =
    selectedTemplate.category;

}


/* -------------------------------------------------------
   READ FORM ITEMS
------------------------------------------------------- */

function readFormItems() {

  var inputs =
    document.querySelectorAll(
      "#items input"
    );


  return Array
    .from(inputs)
    .map(function(input) {
      return input.value;
    });

}


/* -------------------------------------------------------
   ADD ITEM
------------------------------------------------------- */

function addChecklistItem() {

  selectedTemplate.items =
    readFormItems();


  selectedTemplate.items.push(
    ""
  );


  render();


  setTimeout(function() {

    var inputs =
      document.querySelectorAll(
        "#items input"
      );


    if (inputs.length) {

      inputs[
        inputs.length - 1
      ].focus();

    }

  }, 0);

}


/* -------------------------------------------------------
   REMOVE ITEM
------------------------------------------------------- */

function removeChecklistItem(
  index
) {

  selectedTemplate.items =
    readFormItems();


  selectedTemplate.items.splice(
    index,
    1
  );


  if (
    selectedTemplate.items.length === 0
  ) {

    selectedTemplate.items.push(
      ""
    );

  }


  render();

}


/* -------------------------------------------------------
   SAVE TEMPLATE
------------------------------------------------------- */

function saveTemplate() {

  var nameInput =
    document.getElementById(
      "templateName"
    );


  var descriptionInput =
    document.getElementById(
      "templateDescription"
    );


  var categoryInput =
    document.getElementById(
      "templateCategory"
    );


  var name =
    nameInput.value.trim();


  var description =
    descriptionInput.value.trim();


  var category =
    categoryInput.value;


  var items =
    readFormItems()
      .map(function(item) {
        return item.trim();
      })
      .filter(function(item) {
        return item.length > 0;
      });


  if (!name) {

    window.alert(
      "Please enter a template name."
    );

    return;

  }


  if (!items.length) {

    window.alert(
      "Please add at least one checklist item."
    );

    return;

  }


  var template = {

    id:
      editingId ||
      (
        "template-" +
        Date.now()
      ),

    name:
      name,

    description:
      description,

    category:
      category,

    icon:
      selectedTemplate.icon ||
      "▤",

    starter:
      false,

    items:
      items

  };


  if (editingId !== null) {

    var index =
      myTemplates.findIndex(
        function(item) {
          return item.id === editingId;
        }
      );


    if (index >= 0) {

      myTemplates[index] =
        template;

    }

  } else {

    myTemplates.unshift(
      template
    );

  }


  saveMyTemplates();


  selectedTemplate =
    template;


  editingId = null;


  currentScreen =
    "success";


  render();

}


/* -------------------------------------------------------
   OPEN CARD PICKER
------------------------------------------------------- */

function openCardPicker() {

  currentSearch = "";

  currentCategory = "All";

  currentScreen =
    "picker";

  render();

}


/* -------------------------------------------------------
   PICKER
------------------------------------------------------- */

function renderPicker() {

  var all =
    getAllTemplates();


  var categories = [
    "All"
  ];


  all.forEach(
    function(template) {

      if (
        !categories.includes(
          template.category
        )
      ) {

        categories.push(
          template.category
        );

      }

    }
  );


  var shown =
    all.filter(
      function(template) {

        var categoryMatch =
          currentCategory === "All" ||
          template.category ===
            currentCategory;


        var searchText =
          (
            template.name +
            " " +
            template.category +
            " " +
            (template.description || "")
          ).toLowerCase();


        var searchMatch =
          searchText.includes(
            currentSearch.toLowerCase()
          );


        return (
          categoryMatch &&
          searchMatch
        );

      }
    );


  var html =
    header(
      "Add Checklist to Card"
    );


  html += `
    <div class="content">

      <input
        class="search"
        placeholder="⌕  Search templates..."
        value="${escapeHtml(currentSearch)}"
        oninput="
          currentSearch=this.value;
          render();
        "
      >


      <div class="category-tabs">

        ${
          categories
            .map(
              function(category) {

                return `
                  <button
                    class="${
                      currentCategory === category
                        ? "active"
                        : ""
                    }"
                    onclick="
                      currentCategory=${JSON.stringify(category)};
                      render();
                    "
                  >
                    ${escapeHtml(category)}
                  </button>
                `;

              }
            )
            .join("")
        }

      </div>
  `;


  if (!shown.length) {

    html += `
      <div class="empty">
        No templates found.
      </div>
    `;

  } else {

    shown.forEach(
      function(template) {

        html += `
          <div class="pick">

            <span class="doc">
              ${template.icon || "▤"}
            </span>

            <span class="pick-name">

              ${escapeHtml(
                template.name
              )}

              <small class="muted">
                ${escapeHtml(
                  template.description ||
                  (
                    template.items.length +
                    " checklist items"
                  )
                )}
              </small>

            </span>

            <button
              class="use-button"
              onclick="
                selectTemplateForCard(
                  '${template.id}'
                )
              "
            >
              Use
            </button>

          </div>
        `;

      }
    );

  }


  html += `
    </div>

    <div class="footer">

      <button
        class="secondary"
        onclick="goToList()"
      >
        Cancel
      </button>

    </div>
  `;


  app.innerHTML =
    html;

}


/* -------------------------------------------------------
   SELECT TEMPLATE
------------------------------------------------------- */

function selectTemplateForCard(
  id
) {

  var template =
    findTemplateById(id);


  if (!template) {

    showError(
      "Template could not be found."
    );

    return;

  }


  selectedTemplate =
    JSON.parse(
      JSON.stringify(
        template
      )
    );


  currentScreen =
    "preview";


  render();

}


/* -------------------------------------------------------
   PREVIEW
------------------------------------------------------- */

function openTemplatePreview(
  id
) {

  var template =
    findTemplateById(id);


  if (!template) {
    return;
  }


  selectedTemplate =
    JSON.parse(
      JSON.stringify(
        template
      )
    );


  currentScreen =
    "preview";


  render();

}


function renderPreview() {

  if (!selectedTemplate) {

    openCardPicker();

    return;

  }


  var html =
    header(
      "Template Preview"
    );


  html += `
    <div class="preview">

      <div class="preview-title">

        <span
          class="doc"
          style="font-size:22px"
        >
          ${selectedTemplate.icon || "▤"}
        </span>

        <div>

          <strong>
            ${escapeHtml(
              selectedTemplate.name
            )}
          </strong>

          <div class="muted">
            ${escapeHtml(
              selectedTemplate.category
            )}
            ·
            ${selectedTemplate.items.length}
            items
          </div>

        </div>

      </div>
  `;


  selectedTemplate.items
    .forEach(function(item) {

      html += `
        <div class="preview-item">

          <input
            type="checkbox"
            disabled
          >

          <span>
            ${escapeHtml(item)}
          </span>

        </div>
      `;

    });


  html += `
    </div>

    <div class="footer">

      <button
        class="secondary"
        onclick="
          currentScreen='picker';
          render();
        "
      >
        Back
      </button>

      <button
        class="primary"
        onclick="addSelectedToCard()"
      >
        Add to Card
      </button>

    </div>
  `;


  app.innerHTML =
    html;

}


/* -------------------------------------------------------
   ADD TO CARD
------------------------------------------------------- */

function addSelectedToCard() {

  if (!selectedTemplate) {

    showError(
      "Please select a checklist template first."
    );

    return;

  }


  /*
   * IMPORTANT:
   *
   * First we send the selected template to
   * the parent Trello card iframe.
   *
   * This makes the current UI work correctly.
   */

  try {

    if (
      window.parent &&
      window.parent !== window
    ) {

      window.parent.postMessage(
        {
          type:
            "rcl:checklist-added",

          template:
            selectedTemplate
        },
        "*"
      );

    }

  } catch (error) {

    console.error(
      "Parent message failed:",
      error
    );

  }


  currentScreen =
    "success";


  render();

}


/* -------------------------------------------------------
   SUCCESS
------------------------------------------------------- */

function renderSuccess() {

  app.innerHTML = `

    <div class="success">

      <div class="checkmark">
        ✓
      </div>

      <h2>
        Checklist Added
      </h2>

      <div class="muted">

        ${escapeHtml(
          selectedTemplate
            ? selectedTemplate.name
            : "Checklist"
        )}

        has been added
        <br>
        to this card.

      </div>


      <div class="success-actions">

        <button
          class="secondary"
          onclick="openCardPicker()"
        >
          Add Another
        </button>

        <button
          class="primary"
          onclick="goToList()"
        >
          Done
        </button>

      </div>

    </div>

  `;

}


/* -------------------------------------------------------
   ERROR
------------------------------------------------------- */

function showError(
  message
) {

  var old =
    document.querySelector(
      ".error"
    );


  if (old) {
    old.remove();
  }


  var box =
    document.createElement(
      "div"
    );


  box.className =
    "error";


  box.textContent =
    message;


  document.body.appendChild(
    box
  );


  setTimeout(
    function() {

      if (box.parentNode) {
        box.remove();
      }

    },
    5000
  );

}


/* -------------------------------------------------------
   INITIAL RENDER
------------------------------------------------------- */

render();

</script>

</body>
</html>
