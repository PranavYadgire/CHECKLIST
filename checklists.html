<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checklist Templates</title>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<style>
:root{
  --blue:#0c66e4;
  --blue-dark:#0747a6;
  --blue-soft:#e9f2ff;
  --blue-soft-2:#f4f8ff;
  --text:#172b4d;
  --muted:#6b778c;
  --line:#e6e9ee;
  --surface:#fff;
  --surface-soft:#f7f8fa;
  --danger:#c9372c;
  --danger-soft:#ffebe6;
  --green:#22a06b;
  --shadow:0 10px 30px rgba(9,30,66,.12);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  font-size:13px;
  background:#f7f8fa;
}

button,input,select{font:inherit}
button{cursor:pointer}

#app{
  width:100%;
  max-width:460px;
  margin:0 auto;
  background:var(--surface);
  min-height:100vh;
}

.header{
  height:58px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:10;
}

.header h1{
  font-size:16px;
  line-height:1;
  margin:0;
  font-weight:750;
  letter-spacing:-.1px;
}

.close{
  width:32px;
  height:32px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#44546f;
  font-size:22px;
  line-height:1;
  padding:0;
  display:grid;
  place-items:center;
}

.close:hover{
  background:#f1f2f4;
  color:var(--text);
}

.content{
  padding:14px 16px 22px;
}

.search{
  width:100%;
  height:40px;
  border:1px solid #b7c2d0;
  border-radius:9px;
  padding:0 12px;
  outline:none;
  background:#fff;
  color:var(--text);
  transition:.15s;
}

.search::placeholder{color:#7a869a}
.search:hover{border-color:#8c9aaa}

.search:focus,
.field input:focus,
.field select:focus,
.item-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(12,102,228,.12);
}

.tabs{
  display:flex;
  gap:2px;
  border-bottom:1px solid var(--line);
  margin-top:12px;
}

.tab{
  flex:1;
  border:0;
  background:transparent;
  color:#5e6c84;
  padding:11px 7px 10px;
  font-weight:600;
  position:relative;
}

.tab:hover{
  color:var(--text);
  background:#fafbfc;
}

.tab.active{
  color:var(--blue);
  font-weight:750;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:14px;
  right:14px;
  bottom:-1px;
  height:2px;
  border-radius:2px;
  background:var(--blue);
}

.create{
  width:100%;
  border:1px solid #cfe0fb;
  border-radius:9px;
  background:var(--blue-soft);
  color:var(--blue-dark);
  font-weight:750;
  padding:11px 12px;
  margin:13px 0 17px;
  transition:.15s;
}

.create:hover{
  background:#dcecff;
  border-color:#b8d2f7;
  transform:translateY(-1px);
}

.starter-intro{
  display:flex;
  gap:10px;
  align-items:flex-start;
  background:linear-gradient(135deg,#f4f8ff,#fff);
  border:1px solid #dbe7f8;
  border-radius:11px;
  padding:12px;
  margin:13px 0 17px;
}

.starter-intro-icon{
  width:34px;
  height:34px;
  flex:none;
  border-radius:9px;
  background:var(--blue-soft);
  color:var(--blue);
  display:grid;
  place-items:center;
  font-size:17px;
}

.starter-intro strong{
  display:block;
  font-size:12px;
  margin-bottom:3px;
}

.starter-intro p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}

.category{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.55px;
  font-weight:800;
  color:#6b778c;
  margin:18px 2px 7px;
}

.category:first-child{margin-top:2px}

.template{
  min-height:56px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 7px;
  border:1px solid transparent;
  border-radius:10px;
  transition:.15s;
  margin-bottom:3px;
}

.template:hover{
  background:#f8fafc;
  border-color:#e6ebf2;
}

.doc{
  width:36px;
  height:36px;
  border-radius:9px;
  background:#f1f5fa;
  display:grid;
  place-items:center;
  color:#44546f;
  font-size:16px;
  flex:none;
  border:1px solid #e6eaf0;
}

.template:hover .doc{
  background:var(--blue-soft);
  color:var(--blue);
  border-color:#d6e5fa;
}

.template-name{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:650;
  font-size:13px;
}

.template-sub{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:500;
  margin-top:2px;
}

.count{
  font-size:10px;
  color:#5e6c84;
  background:#f1f2f4;
  border-radius:999px;
  padding:4px 7px;
  white-space:nowrap;
}

.more{
  width:30px;
  height:30px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#6b778c;
  padding:0;
  font-size:16px;
  letter-spacing:1px;
}

.more:hover{
  background:#ebecf0;
  color:var(--text);
}

.menu{
  position:fixed;
  z-index:100;
  background:#fff;
  border:1px solid #dfe3e8;
  box-shadow:0 12px 30px rgba(9,30,66,.18);
  border-radius:10px;
  width:190px;
  padding:5px;
}

.menu button{
  width:100%;
  text-align:left;
  border:0;
  background:#fff;
  padding:9px 10px;
  border-radius:7px;
  color:var(--text);
  font-weight:600;
}

.menu button:hover{
  background:#f1f2f4;
}

.menu .danger{color:var(--danger)}

.menu .danger:hover{
  background:var(--danger-soft);
}

.footer{
  padding:11px 16px 16px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  border-top:1px solid var(--line);
  background:#fff;
}

.primary,
.secondary,
.danger-btn{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  font-weight:750;
  transition:.15s;
}

.primary{
  background:var(--blue);
  color:#fff;
  box-shadow:0 1px 2px rgba(9,30,66,.12);
}

.primary:hover{
  background:var(--blue-dark);
  transform:translateY(-1px);
}

.secondary{
  background:#f1f2f4;
  color:var(--text);
}

.secondary:hover{
  background:#dfe1e6;
}

.danger-btn{
  background:#fff;
  color:var(--danger);
  border:1px solid #ffbdad;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:42px 12px;
}

.form{
  padding:18px 16px 20px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-weight:750;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  height:40px;
  border:1px solid #b7c2d0;
  border-radius:8px;
  padding:0 10px;
  background:#fff;
  outline:none;
}

.items-label{
  font-weight:750;
  margin-bottom:8px;
}

.items{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.item{
  display:flex;
  align-items:center;
  gap:7px;
}

.grip{
  width:14px;
  color:#8a95a5;
  text-align:center;
}

.item-input{
  flex:1;
  min-width:0;
  height:36px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:0 9px;
  outline:none;
}

.trash{
  width:30px;
  height:30px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#6b778c;
  padding:0;
}

.trash:hover{
  background:var(--danger-soft);
  color:var(--danger);
}

.add-item{
  border:1px dashed #b7c2d0;
  background:#fff;
  color:var(--blue);
  border-radius:8px;
  padding:8px 11px;
  margin-top:9px;
  font-weight:700;
}

.add-item:hover{
  background:var(--blue-soft);
  border-color:#9dbde8;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  border-top:1px solid var(--line);
  margin-top:20px;
  padding-top:13px;
}

.success{
  text-align:center;
  padding:48px 22px;
}

.check{
  width:50px;
  height:50px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#e3fcef;
  color:var(--green);
  font-size:27px;
  margin:0 auto 14px;
}

.success h2{
  font-size:18px;
  margin:0 0 6px;
}

.success p{
  color:var(--muted);
  line-height:1.5;
  margin:0;
}

.success-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:20px;
}

.preview{
  padding:17px 16px 18px;
}

.preview-head{
  display:flex;
  gap:11px;
  align-items:center;
  margin-bottom:15px;
  padding:12px;
  border:1px solid #e2e7ee;
  border-radius:11px;
  background:#fafbfc;
}

.preview-icon{
  width:38px;
  height:38px;
  border-radius:9px;
  background:var(--blue-soft);
  color:var(--blue);
  display:grid;
  place-items:center;
  font-size:18px;
  flex:none;
}

.preview-head strong{
  display:block;
  font-size:14px;
}

.preview-head small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.preview-item{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #e4e8ee;
  border-radius:9px;
  padding:10px 11px;
  margin-bottom:7px;
  background:#fff;
}

.preview-item:hover{
  background:#fafcff;
  border-color:#cfe0fb;
}

.preview-item input{
  width:16px;
  height:16px;
  accent-color:var(--blue);
  flex:none;
}

.preview-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  border-top:1px solid var(--line);
  margin-top:16px;
  padding-top:13px;
}

.category-tabs{
  display:flex;
  overflow-x:auto;
  border-bottom:1px solid var(--line);
  margin:10px 0 10px;
  scrollbar-width:none;
}

.category-tabs::-webkit-scrollbar{
  display:none;
}

.category-tabs button{
  border:0;
  background:transparent;
  color:#5e6c84;
  padding:9px 10px;
  white-space:nowrap;
  font-weight:600;
}

.category-tabs button.active{
  color:var(--blue);
  font-weight:750;
  border-bottom:2px solid var(--blue);
}

.pick{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:52px;
  padding:7px;
  border:1px solid transparent;
  border-radius:9px;
  margin-bottom:3px;
}

.pick:hover{
  background:#f8fafc;
  border-color:#e6ebf2;
}

.pick-name{
  flex:1;
  min-width:0;
  font-weight:650;
}

.pick button{
  border:1px solid #cfe0fb;
  background:var(--blue-soft);
  color:var(--blue-dark);
  border-radius:7px;
  padding:6px 10px;
  font-weight:750;
}

.pick button:hover{
  background:#dcecff;
}

.status{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  background:#172b4d;
  color:#fff;
  padding:10px 14px;
  border-radius:9px;
  display:none;
  z-index:200;
  max-width:90%;
  text-align:center;
  box-shadow:0 8px 24px rgba(9,30,66,.22);
}

.status.show{display:block}
.status.error{background:#c9372c}

@media(min-width:700px){
  body{
    background:#f1f2f4;
    padding:22px 0;
  }

  #app{
    border-radius:12px;
    box-shadow:var(--shadow);
    min-height:0;
    overflow:hidden;
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="status" class="status"></div>

<script>

const starter = [
  {
    name:"Website QA Checklist",
    category:"QA & Testing",
    items:[
      "Test on staging environment",
      "Check mobile view",
      "Check broken links",
      "Verify analytics tracking",
      "Get client sign-off",
      "Deploy to production"
    ],
    starter:true
  },
  {
    name:"Mobile App QA",
    category:"QA & Testing",
    items:[
      "Install application",
      "Test login",
      "Test navigation",
      "Check notifications",
      "Test on multiple devices",
      "Check performance",
      "Verify app permissions",
      "Test logout"
    ],
    starter:true
  },
  {
    name:"Regression Testing",
    category:"QA & Testing",
    items:[
      "Review requirements",
      "Run smoke tests",
      "Test critical flows",
      "Check existing features",
      "Verify bug fixes",
      "Prepare test report"
    ],
    starter:true
  },
  {
    name:"Product Launch",
    category:"Product Launch",
    items:[
      "Finalize product",
      "Prepare launch plan",
      "Create marketing assets",
      "Test product",
      "Publish announcement",
      "Monitor launch",
      "Collect feedback",
      "Review results",
      "Share report"
    ],
    starter:true
  },
  {
    name:"Feature Launch",
    category:"Product Launch",
    items:[
      "Define feature scope",
      "Complete development",
      "Perform QA",
      "Prepare documentation",
      "Deploy feature",
      "Monitor performance",
      "Collect feedback"
    ],
    starter:true
  },
  {
    name:"Client Onboarding",
    category:"Onboarding",
    items:[
      "Create client profile",
      "Send welcome email",
      "Schedule kickoff call",
      "Collect requirements",
      "Set up access",
      "Share documentation",
      "Complete training",
      "Confirm onboarding"
    ],
    starter:true
  },
  {
    name:"Employee Onboarding",
    category:"Onboarding",
    items:[
      "Prepare workstation",
      "Create accounts",
      "Share company policies",
      "Introduce team",
      "Assign mentor",
      "Complete training",
      "Review first week",
      "Collect feedback",
      "Set goals",
      "Schedule check-in"
    ],
    starter:true
  },
  {
    name:"Campaign Launch",
    category:"Marketing",
    items:[
      "Define campaign goals",
      "Identify target audience",
      "Prepare content",
      "Create campaign assets",
      "Review campaign",
      "Schedule launch"
    ],
    starter:true
  }
];

let mine = [];

try{
  mine = JSON.parse(localStorage.getItem("rcl_mine") || "null");
}catch(e){
  mine = null;
}

if(!Array.isArray(mine)){
  mine = [];
}

let screen = "list";
let tab = "mine";
let query = "";
let cat = "All";
let editIndex = -1;
let selected = null;

const app = document.getElementById("app");
const statusEl = document.getElementById("status");

function save(){
  localStorage.setItem(
    "rcl_mine",
    JSON.stringify(mine)
  );
}

function closeMenu(){
  document
    .querySelectorAll(".menu")
    .forEach(x => x.remove());
}

function toast(message,error=false){
  statusEl.textContent = message;

  statusEl.className =
    "status show" +
    (error ? " error" : "");

  clearTimeout(window.__toast);

  window.__toast = setTimeout(
    () => {
      statusEl.className = "status";
    },
    3500
  );
}

function esc(value){
  return String(value ?? "")
    .replace(/[&<>"']/g,c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));
}

/* Main header.
   showClose=false is used ONLY on the main library screen.
*/
function header(title,showClose=true){
  return `
    <header class="header">
      <h1>${esc(title)}</h1>

      ${
        showClose
        ? `
          <button
            class="close"
            onclick="screen='list';render()"
            aria-label="Close"
          >
            ×
          </button>
        `
        : ""
      }
    </header>
  `;
}

function render(){
  closeMenu();

  if(screen === "list"){
    list();
  }

  if(screen === "form"){
    form();
  }

  if(screen === "created"){
    created();
  }

  if(screen === "picker"){
    picker();
  }

  if(screen === "preview"){
    preview();
  }

  if(screen === "added"){
    added();
  }
}

function visibleTemplates(){

  const source =
    tab === "starter"
      ? starter
      : mine;

  return source.filter(
    x =>
      (x.name + " " + x.category)
        .toLowerCase()
        .includes(query.toLowerCase())
  );
}

function list(){

  const arr = visibleTemplates();
  const groups = {};

  arr.forEach(
    x => {
      (groups[x.category] ??= []).push(x);
    }
  );

  app.innerHTML =
    header(
      "Checklist Templates",
      false
    ) +

    `
    <main class="content">

      <input
        class="search"
        value="${esc(query)}"
        placeholder="⌕  Search templates..."
        oninput="query=this.value;render()"
        aria-label="Search templates"
      >

      <div class="tabs">

        <button
          class="tab ${tab==="mine"?"active":""}"
          onclick="tab='mine';query='';render()"
        >
          My Templates
        </button>

        <button
          class="tab ${tab==="starter"?"active":""}"
          onclick="tab='starter';query='';render()"
        >
          Starter Templates
        </button>

      </div>

      ${
        tab === "mine"
        ?
        `
        <button
          class="create"
          onclick="newTemplate()"
        >
          ＋ Create Template
        </button>
        `
        :
        `
        <div class="starter-intro">

          <div class="starter-intro-icon">
            ✦
          </div>

          <div>
            <strong>Ready-to-use templates</strong>

            <p>
              Start quickly with professionally structured
              checklists. Preview or use one directly on a card.
            </p>
          </div>

        </div>
        `
      }

      ${
        Object.entries(groups)
          .map(
            ([category,items]) => `

              <div class="category">
                ${esc(category)}
              </div>

              ${
                items
                  .map(
                    x => {

                      const id =
                        tab === "mine"
                          ? x.id
                          : starter.indexOf(x);

                      return `

                        <div class="template">

                          <span class="doc">
                            ▤
                          </span>

                          <span style="flex:1;min-width:0">

                            <span class="template-name">
                              ${esc(x.name)}
                            </span>

                            <span class="template-sub">
                              ${
                                tab === "starter"
                                  ? "Ready to use"
                                  : "Custom template"
                              }
                            </span>

                          </span>

                          <span class="count">
                            ${x.items.length} items
                          </span>

                          <button
                            class="more"
                            onclick="openMenu(event,'${esc(String(id))}')"
                            aria-label="Template options"
                          >
                            ···
                          </button>

                        </div>

                      `;
                    }
                  )
                  .join("")
              }

            `
          )
          .join("")
      }

      ${
        !Object.keys(groups).length
          ? `
            <div class="empty">
              No templates found.
            </div>
          `
          : ""
      }

    </main>
    `;
}

function getTemplate(id){

  if(tab === "mine"){
    return mine.find(
      x => x.id === id
    );
  }

  return starter[Number(id)];
}

function openMenu(event,id){

  event.stopPropagation();

  closeMenu();

  const rect =
    event.currentTarget.getBoundingClientRect();

  const menu =
    document.createElement("div");

  menu.className = "menu";

  menu.style.left =
    Math.max(
      8,
      Math.min(
        rect.left - 135,
        innerWidth - 198
      )
    ) + "px";

  menu.style.top =
    Math.min(
      rect.bottom + 3,
      innerHeight - 220
    ) + "px";

  menu.innerHTML = `

    <button onclick="addFromMenu('${id}')">
      ＋ &nbsp; Add to Card
    </button>

    <button onclick="previewFromMenu('${id}')">
      ◉ &nbsp; Preview
    </button>

    ${
      tab === "mine"
      ?
      `

        <button onclick="editFromMenu('${id}')">
          ✎ &nbsp; Edit Template
        </button>

        <button onclick="duplicateFromMenu('${id}')">
          ▣ &nbsp; Duplicate
        </button>

        <button
          class="danger"
          onclick="deleteFromMenu('${id}')"
        >
          ▤ &nbsp; Delete Template
        </button>

      `
      :
      ""
    }

  `;

  document.body.appendChild(menu);

  setTimeout(
    () => {

      document.addEventListener(
        "click",
        closeMenu,
        {once:true}
      );

    },
    0
  );
}

function addFromMenu(id){

  closeMenu();

  selected =
    getTemplate(id);

  addToCard();
}

function previewFromMenu(id){

  closeMenu();

  selected =
    getTemplate(id);

  screen = "preview";

  render();
}

function editFromMenu(id){

  closeMenu();

  editIndex =
    mine.findIndex(
      x => x.id === id
    );

  if(editIndex < 0){
    return;
  }

  selected =
    JSON.parse(

function duplicateFromMenu(id){

  closeMenu();

  const original =
    getTemplate(id);

  if(!original){
    return;
  }

  const copy =
    JSON.parse(
      JSON.stringify(original)
    );

  copy.id =
    crypto.randomUUID();

  copy.name =
    copy.name + " (Copy)";

  copy.starter = false;

  mine.unshift(copy);

  save();

  tab = "mine";

  render();

  toast("Template duplicated");
}

function deleteFromMenu(id){

  closeMenu();

  const index =
    mine.findIndex(
      x => x.id === id
    );

  if(index < 0){
    return;
  }

  if(
    !confirm(
      "Delete this template?"
    )
  ){
    return;
  }

  mine.splice(index,1);

  save();

  render();

  toast("Template deleted");
}

function itemRow(value,index){

  return `

function addItem(){

  document
    .getElementById("items")

      "beforeend",
      itemRow("",Date.now())

  const inputs =
    document.querySelectorAll(
      ".item-input"
    );

  inputs[inputs.length - 1]?.focus();
}

function saveTemplate(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const category =
    document
      .getElementById("category")
      .value;

  const items =
    [
      ...document.querySelectorAll(
        ".item-input"
      )
    ]
      .map(
        x => x.value.trim()
      )
      .filter(Boolean);

  if(!name){

    toast(
      "Enter a template name.",
      true
    );

    return;
  }

  if(!items.length){

    toast(
      "Add at least one checklist item.",
      true
    );

    return;
  }

  if(editIndex >= 0){

    mine[editIndex] = {
      ...mine[editIndex],
      name,
      category,
      items
    };

    selected =
      JSON.parse(
        JSON.stringify(
          mine[editIndex]
        )
      );

  }else{

    const created = {
      id:crypto.randomUUID(),
      name,
      category,
      items,
      starter:false
    };

    mine.unshift(created);

    selected =
      JSON.parse(
        JSON.stringify(created)
      );
  }

  save();

  screen = "created";

  render();
}

/*
  Trello REST integration
*/

async function getTrelloContext(){

  const trello =
    window.TrelloPowerUp.iframe({
      appKey:
        window.RCL_APP_KEY,
      appName:
        window.RCL_APP_NAME
    });

  return trello;
}

async function trelloRequest(
  method,
  path,
  params={}
){

  const trello =
    await getTrelloContext();

  const restApi =
    await trello.getRestApi();

  const authorized =
    await restApi.isAuthorized();

  if(!authorized){

    const error =
      new Error(
        "NOT_AUTHORIZED"
      );

    error.code =
      "NOT_AUTHORIZED";

    throw error;
  }

  const token =
    await restApi.getToken();

  if(!token){

    const error =
      new Error(
        "NOT_AUTHORIZED"
      );

    error.code =
      "NOT_AUTHORIZED";

    throw error;
  }

  const query =
    new URLSearchParams();

  query.set(
    "key",
    window.RCL_APP_KEY
  );

  query.set(
    "token",
    token
  );

  Object.entries(params)
    .forEach(
      ([key,value]) => {

        if(
          value !== undefined &&
          value !== null
        ){

          query.set(
            key,
            String(value)
          );

        }

      }
    );

  const response =
    await fetch(
      `https://api.trello.com/1${path}?${query.toString()}`,
      {
        method
      }
    );

  if(!response.ok){

    let message =
      `Trello API request failed (${response.status}).`;

    try{

      const body =
        await response.json();

      if(body?.message){
        message =
          body.message;
      }

    }catch(e){}

    throw new Error(
      message
    );
  }

  return response.json();
}

async function addToCard(){

  if(!selected){
    return;
  }

  try{

    screen = "added";
    render();

    const trello =
      await getTrelloContext();

    const card =
      await trello.card("id");

    if(!card?.id){

      throw new Error(
        "Could not find the current Trello card."
      );
    }

    const restApi =
      await trello.getRestApi();

    const authorized =
      await restApi.isAuthorized();

    if(!authorized){

      const error =
        new Error(
          "NOT_AUTHORIZED"
        );

      error.code =
        "NOT_AUTHORIZED";

      throw error;
    }

    /*
      Create the checklist.
    */

    const checklist =
      await trelloRequest(
        "POST",
        `/cards/${card.id}/checklists`,
        {
          name:selected.name
        }
      );

    /*
      Create each checklist item.
    */

    for(
      const item
      of selected.items
    ){

      const itemName =
        typeof item === "string"
          ? item.trim()
          : String(
              item?.name || ""
            ).trim();

      if(!itemName){
        continue;
      }

      await trelloRequest(
        "POST",
        `/checklists/${checklist.id}/checkItems`,
        {
          name:itemName
        }
      );
    }

    screen = "added";
    render();

    toast(
      "Checklist added to Trello card."
    );

  }catch(error){

    console.error(
      "[Checklist Library] Add to Card error:",
      error
    );

    screen = "preview";
    render();

    if(
      error?.message ===
      "NOT_AUTHORIZED" ||
      error?.code ===
      "NOT_AUTHORIZED"
    ){

      toast(
        "Please connect the Power-Up to Trello first.",
        true
      );

      try{

        const trello =
          await getTrelloContext();

        await trello.popup({
          title:
            "Connect Trello Account",
          url:
            "./auth.html",
          height:
            320
        });

      }catch(e){

        console.error(
          "Authorization popup error:",
          e
        );

      }

    }else{

      toast(
        error?.message ||
        "Failed to add checklist to Trello card.",
        true
      );

    }

  }
}
