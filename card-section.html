<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist Templates</title>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #172b4d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .section {
      padding: 2px 0 8px;
    }

    .heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #0b3b4a;
      color: white;
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: #172b4d;
    }

    .subtitle {
      font-size: 12px;
      color: #626f86;
      margin-top: 2px;
    }

    .open {
      margin-left: 38px;
      border: 0;
      border-radius: 5px;
      background: #f1f2f4;
      color: #172b4d;
      padding: 9px 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .open:hover {
      background: #dfe1e6;
    }

    .open:active {
      transform: translateY(1px);
    }
    /* =========================================================
   CHECKLIST TEMPLATES - REFERENCE STYLE
   ========================================================= */

.section {
  margin-top: 28px;
}

.heading {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.heading .icon {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;

  display: grid;
  place-items: center;

  border-radius: 9px;

  background: #0b3b4a;
  color: #ffffff;

  font-size: 18px;
}

.heading-content {
  min-width: 0;
  padding-top: 1px;
}

.heading .title {
  font-size: 18px;
  line-height: 22px;
  font-weight: 700;
  color: #172b4d;
}

.heading .subtitle {
  margin-top: 4px;

  font-size: 14px;
  line-height: 20px;

  color: #626f86;
}

.open {
  margin-top: 14px;
  margin-left: 50px;

  border: 0;
  border-radius: 7px;

  background: #f1f2f4;
  color: #172b4d;

  padding: 11px 16px;

  font-size: 15px;
  font-weight: 600;

  cursor: pointer;
}

.open:hover {
  background: #e4e6ea;
  /* =========================================================
   CHECKLIST LIBRARY MODAL - NO PARENT SCROLL
   ========================================================= */

.library-overlay {
  position: fixed !important;
  inset: 0 !important;

  width: 100%;
  height: 100%;

  overflow: hidden !important;
}

.library-dialog {
  width: min(430px, calc(100vw - 32px));
  height: min(620px, calc(100vh - 32px));

  overflow: hidden !important;
}

.library-dialog iframe {
  display: block;

  width: 100%;
  height: 100%;

  border: 0;

  overflow: hidden;
}
}
  </style>
</head>

<body>

  <section class="section">

  <div class="heading">
    <div class="icon">▤</div>

    <div class="heading-content">
      <div class="title">Checklist Templates</div>

      <div class="subtitle">
        Add reusable checklists from your template library to this card.
      </div>
    </div>
  </div>

  <button
    class="open"
    id="openLibrary"
    type="button"
  >
    ▤ &nbsp; Add from Template
  </button>

</section>

  <script>
    const t = TrelloPowerUp.iframe();

    const openLibraryButton =
      document.getElementById("openLibrary");

    openLibraryButton.addEventListener("click", async function (event) {

      try {

        await t.popup({
          title: "Checklist Templates",

          url: t.signUrl("./checklists.html"),

          height: 640,

          mouseEvent: event
        });

      } catch (error) {

        console.error(
          "Failed to open Checklist Library:",
          error
        );

      }

    });
  </script>

</body>

</html>
