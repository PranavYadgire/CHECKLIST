<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trello Card Preview</title>

<style>
:root {
  --page: #24142a;
  --text: #292d33;
  --blue: #0c66e4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: var(--text);
  background: #24142a;
  overflow: hidden;
}

/* Background Trello board */
.board {
  position: absolute;
  inset: 0;
  display: flex;
  gap: 18px;
  padding: 110px 28px 20px;
  opacity: .42;
  pointer-events: none;
}

.list {
  width: 260px;
  min-width: 260px;
  height: 360px;
  background: #e9ebef;
  border-radius: 10px;
  padding: 14px;
}

.list h3 {
  margin: 0 0 14px;
  font-size: 15px;
}

.fake-card {
  height: 66px;
  background: white;
  border-radius: 7px;
  margin: 9px 0;
  box-shadow: 0 1px 2px #0002;
  border-left: 5px solid #f2bd36;
}

/* Card overlay */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(12, 8, 16, .28);
  display: grid;
  place-items: center;
  padding: 12px;
}

/* Main card */
.card-modal {
  width: min(1350px, calc(100vw - 24px));
  height: min(532px, calc(100vh - 24px));
  min-height: 420px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 16px 45px #0005;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Top bar */
.topbar {
  height: 70px;
  flex: 0 0 70px;
  border-bottom: 1px solid #e0e2e6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 27px 0 30px;
}

.list-select {
  border: 0;
  background: #e5e7eb;
  color: #333941;
  border-radius: 5px;
  padding: 7px 9px;
  font-size: 16px;
  cursor: pointer;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 22px;
}

.icon-btn {
  border: 0;
  background: transparent;
  color: #343a40;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  padding: 2px;
}

/* Card content layout */
.content {
  display: grid;
  grid-template-columns: minmax(0, 1.36fr) minmax(350px, 1fr);
  min-height: 0;
  flex: 1;
}

.main-pane {
  padding: 34px 50px 28px 30px;
  overflow: auto;
}

.title-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 0 0 28px;
}

.complete-toggle {
  width: 20px;
  height: 20px;
  border: 2px solid #707780;
  border-radius: 50%;
  background: white;
  cursor: pointer;
  flex: 0 0 auto;
}

.complete-toggle.done {
  background: #22a06b;
  border-color: #22a06b;
  position: relative;
}

.complete-toggle.done::after {
  content: "✓";
  color: white;
  position: absolute;
  font-size: 13px;
  font-weight: 700;
  left: 3px;
  top: -1px;
}

h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 650;
  letter-spacing: -.8px;
  line-height: 1.2;
}

/* Action buttons */
.action-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 0 43px 40px;
}

.action {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border: 1px solid #d9dce1;
  border-radius: 8px;
  background: white;
  color: #505760;
  padding: 8px 12px;
  font-size: 17px;
  min-height: 40px;
  cursor: pointer;
}

.action:hover,
.icon-btn:hover {
  background: #f3f4f6;
}

.symbol {
  font-size: 23px;
  line-height: 16px;
  font-weight: 300;
}

/* Size */
.size-label {
  margin: 0 0 9px 40px;
  color: #5c626b;
  font-weight: 600;
  font-size: 15px;
}

.size-button {
  margin-left: 40px;
  border: 1px solid #8fd8bd;
  border-radius: 7px;
  background: #baf3df;
  color: #164e40;
  padding: 9px 14px;
  font-size: 17px;
  cursor: pointer;
}

/* Description */
.section-title {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 28px 0 22px;
  font-size: 18px;
  font-weight: 650;
}

.description {
  margin-left: 40px;
  width: calc(100% - 40px);
  min-height: 78px;
  border: 1px solid #aeb4bf;
  border-radius: 5px;
  background: #f7f8fa;
  padding: 12px 15px;
  font: inherit;
  font-size: 17px;
  resize: vertical;
  color: var(--text);
}

.description:focus,
.comment-input:focus {
  outline: 2px solid #85b8ff;
  border-color: var(--blue);
}

/* Comments section */
.side-pane {
  background: #f1f2f4;
  border-left: 1px solid #d4d7dd;
  padding: 20px 19px;
  overflow: auto;
}

.activity-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 14px;
}

.activity-title {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 18px;
  font-weight: 650;
  white-space: nowrap;
}

.details-btn {
  border: 1px solid #d4d7dd;
  border-radius: 8px;
  background: transparent;
  color: #555c65;
  padding: 8px 14px;
  font-size: 16px;
  cursor: pointer;
  white-space: nowrap;
}

.comment-input {
  width: 100%;
  height: 47px;
  border: 1px solid #d4d7dd;
  border-radius: 10px;
  background: white;
  padding: 0 14px;
  font: inherit;
  font-size: 17px;
  box-shadow: 0 1px 1px #0000000c;
}

.activity-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin-top: 19px;
  font-size: 16px;
  color: #3d434b;
  line-height: 1.5;
}

.avatar {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #12305c;
  color: white;
  display: grid;
  place-items: center;
  font-size: 14px;
}

.activity-copy {
  padding-top: 0;
}

.activity-copy strong {
  font-weight: 650;
  color: #30353b;
}

.activity-copy a {
  color: #0c66e4;
  display: block;
  font-size: 14px;
  margin-top: 1px;
}

/* Bottom tabs */
.bottom-tabs {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  background: white;
  border: 1px solid #e2e4e8;
  border-bottom: 0;
  border-radius: 15px 15px 0 0;
  padding: 8px 8px 0;
  box-shadow: 0 -2px 12px #00000012;
}

.tab {
  border: 0;
  background: transparent;
  padding: 10px 13px;
  border-radius: 8px 8px 0 0;
  color: #343940;
  font-size: 17px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  color: var(--blue);
  background: #e8f2ff;
}

.tab-divider {
  width: 1px;
  height: 22px;
  background: #d6d9df;
  margin: 0 3px;
}

/* Toast messages */
.toast {
  position: fixed;
  left: 50%;
  bottom: 72px;
  transform: translateX(-50%);
  background: #22272b;
  color: white;
  padding: 10px 15px;
  border-radius: 7px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}

.toast.show {
  opacity: 1;
}

/* Reusable Checklist Library section */
.checklist-section{margin:28px 0 0 40px}
.checklist-heading{display:flex;align-items:center;gap:12px}
.checklist-heading .library-icon{width:32px;height:32px;border-radius:8px;background:#0b3b4a;color:#fff;display:grid;place-items:center;font-size:17px}
.checklist-heading strong{font-size:18px}
.checklist-heading p{margin:2px 0 0;color:#626f86;font-size:14px}
.checklist-add{margin-top:12px;border:1px solid #d9dce1;border-radius:7px;background:#f7f8f9;color:#172b4d;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.checklist-add:hover{background:#ebecf0}
.checklist-card{margin-top:16px;display:none;border-top:1px solid #dfe1e6;padding-top:12px}
.checklist-card.visible{display:block}
.checklist-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.checklist-card-head strong{font-size:16px}
.checklist-progress{font-size:12px;color:#626f86}
.checklist-bar{height:5px;background:#dfe1e6;border-radius:99px;overflow:hidden;margin:7px 0 8px}
.checklist-bar span{display:block;height:100%;width:0;background:#0c66e4}
.checklist-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.checklist-row input{width:16px;height:16px}
.library-overlay{position:fixed;inset:0;background:rgba(9,30,66,.32);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.library-overlay.open{display:flex}
.library-dialog{width:min(430px,100%);height:min(620px,calc(100vh - 36px));background:#fff;border-radius:10px;box-shadow:0 12px 38px rgba(9,30,66,.32);overflow:hidden}
.library-dialog iframe{width:100%;height:100%;border:0}

/* Mobile layout */
@media (max-width: 760px) {
  body {
    overflow: auto;
  }

  .scrim {
    position: absolute;
    align-items: start;
    padding: 8px;
  }

  .card-modal {
    height: auto;
    min-height: calc(100vh - 16px);
    width: 100%;
    margin-bottom: 60px;
  }

  .content {
    display: flex;
    flex-direction: column;
  }

  .main-pane {
    padding: 25px 20px;
  }

  .side-pane {
    border-left: 0;
    border-top: 1px solid #d4d7dd;
    min-height: 260px;
  }

  .action-row,
  .size-label,
  .size-button,
  .description {
    margin-left: 0;
  }

  .description {
    width: 100%;
  }

  h1 {
    font-size: 28px;
  }

  .topbar {
    padding: 0 16px;
  }

  .tab {
    font-size: 13px;
    padding: 9px 8px;
  }

  html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden !important;
}

#app {
  width: 100%;
  height: 100%;
  overflow: hidden !important;
}

.content {
  height: calc(100vh - 54px);
  overflow-y: auto !important;
  overflow-x: hidden !important;
}
}
</style>
</head>

<body>



<!-- Card window -->
<div class="scrim">
  <main class="card-modal" aria-label="Trello card preview">

    <!-- Header -->
    <header class="topbar">
      <button class="list-select" id="listSelect">
        Today⌄
      </button>

      <div class="top-actions">
        <button class="icon-btn" title="Cover">▧</button>
        <button class="icon-btn" title="More options">•••</button>
        <button class="icon-btn" id="closeBtn" title="Close">×</button>
      </div>
    </header>

    <div class="content">

      <!-- Left side -->
      <section class="main-pane">

        <div class="title-row">
          <button
            class="complete-toggle"
            id="completeToggle"
            aria-label="Mark complete">
          </button>

          <h1 contenteditable="true" spellcheck="false">
            exploring
          </h1>
        </div>

        <!-- Card actions -->
        <div class="action-row">
          <button class="action" data-message="Add action selected">
            <span class="symbol">＋</span> Add
          </button>

          <button class="action" data-message="Labels action selected">
            <span class="symbol">◇</span> Labels
          </button>

          <button class="action" data-message="Dates action selected">
            <span class="symbol">◷</span> Dates
          </button>

          <button class="action" data-message="Checklist action selected">
            <span class="symbol">☑</span> Checklist
          </button>

          <button class="action" data-message="Members action selected">
            <span class="symbol">♙</span> Members
          </button>
        </div>

        <!-- Size -->
        <div class="size-label">Size</div>

        <button class="size-button" id="sizeBtn">
          Set card size
        </button>

        <!-- Description -->
        <div class="section-title">
          <span style="font-size:24px">☰</span>
          Description
        </div>

        <textarea
          class="description"
          placeholder="Add a more detailed description..."
          aria-label="Card description">
        </textarea>

        <section class="checklist-section">
          <div class="checklist-heading">
            <div class="library-icon">▤</div>
            <div>
              <strong>Checklist Templates</strong>
              <p>Add reusable checklists from your template library to this card.</p>
            </div>
          </div>
          <button class="checklist-add" id="openChecklistLibrary">▤ &nbsp; Add from Template</button>
          <div class="checklist-card" id="localChecklist">
            <div class="checklist-card-head"><strong id="localChecklistName">Website QA Checklist</strong><span class="checklist-progress" id="localChecklistProgress">0 / 0</span></div>
            <div class="checklist-bar"><span id="localChecklistBar"></span></div>
            <div id="localChecklistItems"></div>
          </div>
        </section>

      </section>

      <!-- Right side -->
      <aside class="side-pane">

        <div class="activity-head">
          <div class="activity-title">
            <span style="font-size:23px">▤</span>
            Comments and activity
          </div>

          <button class="details-btn" id="detailsBtn">
            Show details
          </button>
        </div>

        <!-- Add comment -->
        <form id="commentForm">
          <input
            class="comment-input"
            id="commentInput"
            type="text"
            placeholder="Write a comment..."
            aria-label="Write a comment">
        </form>

        <!-- Activity -->
        <div id="activityList">
          <div class="activity-item">
            <div class="avatar">PY</div>

            <div class="activity-copy">
              <strong>Pranav Krushnarao Yadgire</strong>
              added this card to Today

              <a href="#" onclick="return false">
                Sep 21, 2026, 9:21 PM
              </a>
            </div>
          </div>
        </div>

      </aside>
    </div>
  </main>
</div>

<div class="library-overlay" id="libraryOverlay" aria-hidden="true">
  <div class="library-dialog">
    <iframe src="./checklists.html" title="Checklist Templates"></iframe>
  </div>
</div>

<!-- Bottom tabs -->
<nav class="bottom-tabs" aria-label="Card tabs">

  <button class="tab" data-tab="Power-ups">
    <span style="font-size:21px">♧</span>
    Power-ups
  </button>

  <button class="tab" data-tab="Automations">
    <span style="font-size:21px">ϟ</span>
    Automations
  </button>

  <span class="tab-divider"></span>

  <button class="tab active" data-tab="Comments">
    <span style="font-size:20px">▤</span>
    Comments
  </button>

</nav>

<div class="toast" id="toast" role="status"></div>

<script>
const toast = document.getElementById("toast");
let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1800);
}

// Action buttons
document.querySelectorAll(".action").forEach(button => {
  button.addEventListener("click", () => {
    showToast(button.dataset.message);
  });
});

// Bottom tabs
document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.remove("active");
    });

    button.classList.add("active");
    showToast(button.dataset.tab + " tab selected");
  });
});

// Mark card complete
document.getElementById("completeToggle").addEventListener("click", event => {
  const done = event.currentTarget.classList.toggle("done");

  event.currentTarget.setAttribute(
    "aria-label",
    done ? "Mark incomplete" : "Mark complete"
  );

  showToast(
    done ? "Card marked complete" : "Card marked incomplete"
  );
});

// Demo buttons
document.getElementById("sizeBtn").addEventListener("click", () => {
  showToast("Card size menu preview");
});

document.getElementById("detailsBtn").addEventListener("click", () => {
  showToast("Card details preview");
});

document.getElementById("listSelect").addEventListener("click", () => {
  showToast("List selector preview");
});

document.getElementById("closeBtn").addEventListener("click", () => {
  showToast("Close preview — this is a local demo");
});

const libraryOverlay = document.getElementById("libraryOverlay");
document.getElementById("openChecklistLibrary").addEventListener("click", () => {
  libraryOverlay.classList.add("open");
  libraryOverlay.setAttribute("aria-hidden", "false");

  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
});
libraryOverlay.addEventListener("click", event => {
  if (event.target === libraryOverlay) {
    libraryOverlay.classList.remove("open");
    libraryOverlay.setAttribute("aria-hidden", "true");

    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";
  }
});
window.addEventListener("message", event => {
  if (!event.data || !event.data.template) return;

  const template = event.data.template;

  const checklist = document.getElementById("localChecklist");
  const checklistName = document.getElementById("localChecklistName");
  const items = document.getElementById("localChecklistItems");
  const progress = document.getElementById("localChecklistProgress");
  const bar = document.getElementById("localChecklistBar");

  if (!checklist || !checklistName || !items) return;

  checklistName.textContent = template.name;

  items.innerHTML = "";

  template.items.forEach(item => {
    const row = document.createElement("label");

    row.className = "checklist-row";

    row.innerHTML = `
      <input type="checkbox">
      <span></span>
    `;

    row.querySelector("span").textContent = item;

    row.querySelector("input").addEventListener("change", () => {
      const checks = [...items.querySelectorAll("input")];
      const done = checks.filter(x => x.checked).length;

      progress.textContent = `${done} / ${checks.length}`;

      bar.style.width =
        checks.length
          ? `${done / checks.length * 100}%`
          : "0%";
    });

    items.appendChild(row);
  });

  progress.textContent = `0 / ${template.items.length}`;
  bar.style.width = "0%";

  checklist.classList.add("visible");

  if (typeof libraryOverlay !== "undefined") {
    libraryOverlay.classList.remove("open");
    libraryOverlay.setAttribute("aria-hidden", "true");
  }

  showToast(`"${template.name}" added to card`);
});

// Add comments
document.getElementById("commentForm").addEventListener("submit", event => {
  event.preventDefault();

  const input = document.getElementById("commentInput");
  const value = input.value.trim();

  if (!value) return;

  const item = document.createElement("div");
  item.className = "activity-item";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "PY";

  const copy = document.createElement("div");
  copy.className = "activity-copy";

  const strong = document.createElement("strong");
  strong.textContent = "Pranav Krushnarao Yadgire";

  copy.append(
    strong,
    document.createTextNode(" " + value)
  );

  const time = document.createElement("a");
  time.href = "#";
  time.textContent = "Just now";
  time.onclick = () => false;

  copy.appendChild(time);
  item.append(avatar, copy);

  document.getElementById("activityList").prepend(item);

  input.value = "";
});
</script>

</body>
</html>
