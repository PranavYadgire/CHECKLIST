<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Connect Trello</title>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #172b4d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      padding: 24px;
    }

    .container {
      text-align: center;
    }

    .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 12px;
      background: #0b3b4a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      margin: 0 auto 20px;
      max-width: 340px;
      color: #5e6c84;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      background: #0c66e4;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0055cc;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.4;
    }

    .error {
      color: #c9372c;
    }

    .success {
      color: #216e4e;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">
      ▤
    </div>

    <h2>
      Connect Trello
    </h2>

    <p>
      Connect Reusable Checklist Library to your
      Trello account so it can add checklists to cards.
    </p>

    <button id="authorizeButton">
      Connect to Trello
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>

  <script type="module">

    import {
      APP_KEY,
      APP_NAME
    } from "./src/lib/auth.js";

    const button =
      document.getElementById(
        "authorizeButton"
      );

    const status =
      document.getElementById(
        "status"
      );

    const t =
      window.TrelloPowerUp.iframe({
        appKey: APP_KEY,
        appName: APP_NAME
      });

    async function checkAuthorization() {

      try {

        const api =
          await t.getRestApi();

        const authorized =
          await api.isAuthorized();

        if (authorized) {

          button.textContent =
            "Already Connected";

          button.disabled =
            true;

          status.textContent =
            "Your Trello account is already connected.";

          status.className =
            "status success";

        }

      } catch (error) {

        console.error(
          "[Checklist Library] Auth check failed:",
          error
        );

      }

    }

    button.addEventListener(
      "click",
      async function () {

        button.disabled = true;

        button.textContent =
          "Connecting...";

        status.textContent =
          "Opening Trello authorization...";

        status.className =
          "status";

        try {

          const api =
            await t.getRestApi();

          /*
           * IMPORTANT:
           * This authorize() call is directly
           * inside the button click handler.
           */

          await api.authorize({
            expiration: "never",
            scope: "read,write"
          });

          status.textContent =
            "Connected successfully. You can close this window.";

          status.className =
            "status success";

          button.textContent =
            "Connected";

          button.disabled =
            true;

          /*
           * Tell the parent iframe that authorization
           * has completed.
           */

          try {
            t.notifyParent("done");
          } catch (e) {
            console.log(
              "Parent notification unavailable."
            );
          }

        } catch (error) {

          console.error(
            "[Checklist Library] Authorization failed:",
            error
          );

          status.textContent =
            error?.message ||
            "Authorization was cancelled or failed.";

          status.className =
            "status error";

          button.disabled =
            false;

          button.textContent =
            "Try Again";

        }

      }
    );

    checkAuthorization();

  </script>

</body>
</html>
